name: Onboarding pipeline

# These probes are the regression suite for the SDK build pipeline
# (extern redirect plan, linkage identity, auto-registration across
# dlopen, and game binary Play over PIE IPC). They build the whole
# editor with the dylib feature per platform, so they are kept off the
# per-PR path: they run on pushes to main (which also warms the per-OS
# cache), on release tags, nightly, and on demand.

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  toolchain: nightly-2026-03-05
  # Incremental codegen and dylib linking do not mix: incremental
  # reuse leaves references to hidden anon constants inside the SDK
  # dylib, failing the link with undefined hidden symbols.
  CARGO_INCREMENTAL: "0"

jobs:
  sdk-pipeline:
    name: SDK pipeline - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Nine probes, each building or loading a project against the SDK.
    # On a cold cache 120 minutes ran out partway through the second one
    # and the job reported `cancelled`, which reads as an infrastructure
    # hiccup rather than the missing result it is.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev

      - name: Resolve host triple
        run: |
          echo "TRIPLE=$(rustc -vV | sed -n 's/host: //p')" >> "$GITHUB_ENV"

      - name: Populate target directory from cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
          # Keyed on the cargo config because it carries rustflags: a
          # cache built under different flags mixes crate generations
          # with a fresh build's, which fails links (or dlopen) on
          # symbols whose disambiguators match neither.
          shared-key: onboarding-${{ matrix.os }}-${{ hashFiles('.cargo/config.toml') }}
          # These probes exist to be run against platforms that are
          # failing, and the default saves nothing from a failed job, so
          # the platform under investigation is the one that never gets
          # a warm cache.
          cache-on-failure: true

      - name: Build the SDK and wrapper
        # One target-side cargo invocation with `--bins`: the root package
        # owns the editor bins, so this builds them from a single feature
        # resolution. A separate package selection can rewrite the
        # stable-named runtime dylibs in place and mix two resolutions.
        run: |
          set -euxo pipefail
          cargo build -j 4 -p jackdaw --features dylib --target "$TRIPLE" --bins
          cargo build -p jackdaw_rustc_wrapper

      - name: Auto-registration across dlopen
        # Extension builds generate the dev SDK manifest on demand. The test
        # harness must use that same Cargo profile: dylibs from `test` and
        # `dev` have different symbol identities but share one output name.
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test reflect_auto_register -- --nocapture

      - name: Linkage identity
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test dylib_linkage_identity -- --nocapture

      - name: Ecosystem extern redirect
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test extern_redirect_ecosystem -- --nocapture

      - name: Schema extraction
        run: cargo test -j 4 --test schema_extract -- --nocapture

      - name: Component shape refresh
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test component_shape_refresh -- --nocapture

      - name: Dylib reload memory
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test stress_reload -- --nocapture

      - name: Extension loading
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test dylib_loading -- --nocapture

      - name: Scaffold end-to-end (scaffold -> build -> schema)
        # The user's first-run loop headlessly: scaffold a game, build its
        # binary, and confirm the template component reaches the schema.
        run: cargo test -j 4 --test scaffold_e2e -- --nocapture

      - name: Game binary over PIE IPC
        # Headless runners have no GPU on every platform; the Play
        # test needs a working wgpu adapter for the Frames lane, so it
        # runs only where lavapipe provides one.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers
          cargo test -j 4 --test bsn_game_run -- --nocapture
