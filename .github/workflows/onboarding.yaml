name: Onboarding pipeline

# These probes are the regression suite for the SDK build pipeline
# (extern redirect plan, linkage identity, auto-registration across
# dlopen, and the game runner over PIE IPC). They build the whole
# editor with the dylib feature per platform, so they are kept off the
# per-PR path: they run on pushes to main (which also warms the per-OS
# cache), on release tags, nightly, and on demand.

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  toolchain: nightly-2026-03-05
  # Incremental codegen and dylib linking do not mix: incremental
  # reuse leaves references to hidden anon constants inside the SDK
  # dylib, failing the link with undefined hidden symbols.
  CARGO_INCREMENTAL: "0"

jobs:
  sdk-pipeline:
    name: SDK pipeline - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev

      - name: Resolve host triple
        run: |
          echo "TRIPLE=$(rustc -vV | sed -n 's/host: //p')" >> "$GITHUB_ENV"

      - name: Populate target directory from cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: onboarding-${{ matrix.os }}

      - name: Build the SDK, runner, and wrapper
        run: |
          set -euxo pipefail
          cargo build -j 4 -p jackdaw --features dylib --target "$TRIPLE"
          cargo build -j 4 -p jackdaw_runner --target "$TRIPLE"
          cargo build -p jackdaw_rustc_wrapper

      - name: Auto-registration across dlopen
        run: cargo test -j 4 --features dylib --target "$TRIPLE" --test reflect_auto_register -- --nocapture

      - name: Linkage identity
        run: cargo test -j 4 --features dylib --target "$TRIPLE" --test dylib_linkage_identity -- --nocapture

      - name: Ecosystem extern redirect
        run: cargo test -j 4 --features dylib --target "$TRIPLE" --test extern_redirect_ecosystem -- --nocapture

      - name: Schema extraction
        run: cargo test -j 4 --features dylib --target "$TRIPLE" --test schema_extract -- --nocapture

      - name: Component shape refresh
        run: cargo test -j 4 --features dylib --target "$TRIPLE" --test component_shape_refresh -- --nocapture

      - name: Dylib reload memory
        run: cargo test -j 4 --features dylib --target "$TRIPLE" --test stress_reload -- --nocapture

      - name: Extension loading
        run: cargo test -j 4 --features dylib --target "$TRIPLE" --test dylib_loading -- --nocapture

      - name: Scaffold end-to-end (scaffold -> build -> schema)
        # The user's first-run loop headlessly: scaffold a game, build its
        # dylib against the SDK, and confirm the template component reaches
        # the schema. No GPU needed, so it runs on all three platforms.
        run: cargo test -j 4 --features dylib --target "$TRIPLE" --test scaffold_e2e -- --nocapture

      - name: Game runner over PIE IPC
        # Headless runners have no GPU on every platform; the runner
        # test needs a working wgpu adapter for the Frames lane, so it
        # runs only where lavapipe provides one.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers
          cargo test -j 4 --features dylib --target "$TRIPLE" --test runner_boots_project_dylib -- --nocapture
