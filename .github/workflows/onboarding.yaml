name: Onboarding pipeline

# These probes are the regression suite for the SDK build pipeline
# (extern redirect plan, linkage identity, auto-registration across
# dlopen, and a scaffolded game's schema). Game binary Play runs in the
# heavy tier and on pull requests that touch it. They build the whole
# editor with the dylib feature, so they are kept off the per-PR and
# post-merge paths: Linux runs nightly, every platform runs on release
# tags and on demand.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "52 4 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to probe"
        type: choice
        default: linux
        options: [linux, all]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  toolchain: 1.99.0
  # Incremental codegen and dylib linking do not mix: incremental
  # reuse leaves references to hidden anon constants inside the SDK
  # dylib, failing the link with undefined hidden symbols.
  CARGO_INCREMENTAL: "0"

jobs:
  sdk-pipeline:
    name: SDK pipeline - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A cold run takes up to about two and a half hours (Windows).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS stay off the nightly schedule, where a cold build
        # of their probes is too slow, and run on release tags and on demand.
        os: ${{ fromJSON((inputs.platforms == 'all' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}

      # The SDK, every probe's fixture build and a scaffolded game do not fit
      # beside the runner image's preinstalled toolchains.
      - name: Remove unused software (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      # The scaffolded game answers the schema request from inside its App
      # build, which needs a Vulkan adapter; the runner has no GPU, so
      # lavapipe provides one.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev mesa-vulkan-drivers
        timeout-minutes: 10

      # The tracked cargo config links Linux builds through clang and wild.
      - name: Install cargo binstall
        if: runner.os == 'Linux'
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        if: runner.os == 'Linux'
        run: cargo binstall wild-linker --locked --force

      - name: Resolve host triple
        run: |
          echo "TRIPLE=$(rustc -vV | sed -n 's/host: //p')" >> "$GITHUB_ENV"

      - name: Build the SDK and wrapper
        # One target-side cargo invocation with `--bins`: the root package
        # owns the editor bins, so this builds them from a single feature
        # resolution. A separate package selection can rewrite the
        # stable-named runtime dylibs in place and mix two resolutions.
        run: |
          set -euxo pipefail
          cargo build -j 4 -p jackdaw --features dylib --target "$TRIPLE" --bins
          cargo build -p jackdaw_rustc_wrapper

      - name: Auto-registration across dlopen
        # Extension builds generate the dev SDK manifest on demand. The test
        # harness must use that same Cargo profile: dylibs from `test` and
        # `dev` have different symbol identities but share one output name.
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test reflect_auto_register -- --nocapture

      - name: Linkage identity
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test dylib_linkage_identity -- --nocapture

      # macOS runs only the SDK build and the two probes above, and Windows
      # skips scaffold_e2e: each platform runs its platform-specific probes,
      # and Linux runs every probe.
      - name: Ecosystem extern redirect
        if: runner.os != 'macOS'
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test extern_redirect_ecosystem -- --nocapture

      - name: Component shape refresh
        if: runner.os != 'macOS'
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test component_shape_refresh -- --nocapture

      - name: Dylib reload memory
        if: runner.os != 'macOS'
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test stress_reload -- --nocapture

      - name: Extension loading
        if: runner.os != 'macOS'
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test sdk_layout -- dylib_loading --nocapture

      - name: Scaffold end-to-end (scaffold -> build -> schema)
        # The user's first-run loop headlessly: scaffold a game, build its
        # binary, and confirm the template component reaches the schema.
        if: runner.os == 'Linux'
        run: cargo test -j 4 --profile dev --features dylib --target "$TRIPLE" --test scaffold_e2e -- --nocapture
