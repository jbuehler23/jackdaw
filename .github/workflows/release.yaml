name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  toolchain: nightly-2026-03-05

jobs:
  # Nothing ships unless the end-to-end tier is green: the SDK builds, a game
  # builds against it, and the runner loads an authored scene.
  heavy:
    uses: ./.github/workflows/heavy-tier.yaml

  publish:
    name: Publish to crates.io
    needs: [heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # DEFERRED: crates.io publishing is off until the publishable set is
    # scoped. The editor and rerecast-coupled crates must be marked
    # `publish = false` first (they pull a git-only bevy_rerecast fork that
    # crates.io rejects). The `binaries` bundle job is independent and still
    # runs. Re-enable with `!contains(github.ref_name, '-')` once
    # `cargo publish --dry-run --workspace` is clean.
    if: ${{ false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev

      - name: Publish workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Cargo walks the workspace dependency graph, publishes in
        # topological order, waits for the index to propagate between
        # dependent crates, and skips members marked `publish = false`.
        # Stabilized in Rust 1.90 (cargo 1.90).
        run: cargo publish --workspace --locked

  # Downloadable per-platform bundles: the editor, its CLI, the rustc
  # wrapper, the game runner, the three runtime dylibs, and a relocatable
  # SDK, all in one archive. A user extracts and runs offline - no bootstrap
  # compile, no source checkout. Independent of the crates.io publish.
  binaries:
    name: Bundle - ${{ matrix.triple }}
    needs: [heavy]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            # A literal $ORIGIN reaches the linker (single-quoted below so
            # the shell never expands it): the editor and runner then find
            # their dylibs beside themselves.
            rpath: "-C link-arg=-Wl,-rpath,$ORIGIN"
            archive: tar.zst
          - os: macos-14
            triple: aarch64-apple-darwin
            rpath: "-C link-arg=-Wl,-rpath,@loader_path"
            archive: tar.zst
          # macOS Intel (x86_64-apple-darwin) is dropped: the macos-13
          # runner hangs this bundle build for hours. Apple Silicon
          # (aarch64) is covered above; re-add Intel if the hang is fixed.
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            # Windows loads DLLs from the executable's directory, so no
            # rpath. Leaving RUSTFLAGS unset also preserves the rust-lld
            # linker that .cargo/config.toml selects for the MSVC target.
            rpath: ""
            archive: zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}
          targets: ${{ matrix.triple }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.triple }}

      # The rustc wrapper is a HOST tool (cargo runs it as RUSTC_WRAPPER);
      # built without --target so it lands in target/release, where the
      # bundler's SdkPaths looks for it.
      - name: Build rustc wrapper (host)
        run: cargo build --release -p jackdaw_rustc_wrapper

      # The editor, CLI, runner, SDK dylib, and the bevy/jackdaw runtime
      # dylibs. The explicit --target keeps host units separate; feature
      # unification across `jackdaw` and `jackdaw_runner` gives the runner
      # the SAME bevy the SDK ships, so it can load project dylibs.
      - name: Build editor + runner (target)
        run: |
          RPATH='${{ matrix.rpath }}'
          if [ -n "$RPATH" ]; then export RUSTFLAGS="$RPATH"; fi
          cargo build --release --target ${{ matrix.triple }} -p jackdaw --features dylib -p jackdaw_runner

      - name: Build CLI (target, bevy-free)
        # A SEPARATE invocation on purpose: built alongside the editor,
        # feature unification would turn on jackdaw_project_build/reflect
        # (via the editor's `dylib` feature) and drag bevy into the CLI,
        # which then fails to link on Windows and fails to start on Linux.
        # Alone, the CLI stays bevy-light and links everywhere.
        run: cargo build --release --target ${{ matrix.triple }} -p jackdaw_cli

      - name: Stage the bundle
        run: ./target/${{ matrix.triple }}/release/jackdaw-cli bundle --out "dist/jackdaw-${{ matrix.triple }}" --workspace .

      # An archive that is missing a piece installs and then fails at the first
      # project build, which is how a missing sdk/manifest.txt reached a user.
      - name: Verify the staged bundle
        run: |
          set -euo pipefail
          root="dist/jackdaw-${{ matrix.triple }}"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          missing=0
          for f in sdk/manifest.txt Cargo.lock toolchain.txt \
                   "jackdaw$exe" "jackdaw-cli$exe" "jackdaw-runner$exe" "jackdaw-rustc-wrapper$exe"; do
            if [ ! -f "$root/$f" ]; then echo "bundle is missing $f"; missing=1; fi
          done
          if [ ! -d "$root/sdk/${{ matrix.triple }}" ]; then
            echo "bundle is missing sdk/${{ matrix.triple }}"; missing=1
          fi
          if [ "$missing" -ne 0 ]; then echo "staged bundle is incomplete"; exit 1; fi
          echo "bundle layout verified"

      # Build a game against the just-built release SDK, the way an installed
      # user does. JACKDAW_BUNDLE_SMOKE_REQUIRED turns the test's local-only
      # skip into a hard failure so a broken bundle cannot pass silently.
      - name: Bundle smoke (game builds against the release SDK)
        env:
          JACKDAW_BUNDLE_SMOKE_REQUIRED: "1"
        run: cargo test --features dylib --target ${{ matrix.triple }} --test bundle_smoke -- --nocapture

      - name: Archive (tar.zst)
        if: matrix.archive == 'tar.zst'
        run: tar --zstd -cf "jackdaw-${{ matrix.triple }}.tar.zst" -C dist "jackdaw-${{ matrix.triple }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: 7z a "jackdaw-${{ matrix.triple }}.zip" "./dist/jackdaw-${{ matrix.triple }}"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jackdaw-${{ matrix.triple }}.${{ matrix.archive }}
