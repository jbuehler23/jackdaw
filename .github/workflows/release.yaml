name: Release

on:
  push:
    tags: ["v*"]
  # Warms the macOS release-dependency cache on main, which tags restore:
  # a tag can read the default branch's caches but never another tag's.
  schedule:
    - cron: "23 3 * * 1,4"
  # Dry-run the bundle matrix from a branch. Every step that publishes
  # anything (crates.io, the archive upload, the attestation) is gated on
  # a tag ref, so a dispatch builds, stages, and smoke-tests the bundles
  # and stops there. Cutting a release-candidate tag to find out whether
  # the bundle job works is a slow way to ask a question that has no
  # bearing on the tag.
  workflow_dispatch:
    inputs:
      platform:
        description: "Bundle only this platform (iteration mode)"
        type: choice
        default: all
        options: [all, linux, windows, macos]
      skip_heavy:
        description: "Skip the heavy tier (iteration mode; uploads stay tag-gated)"
        type: boolean
        default: false
      save_cache:
        description: "Save the release-dependency cache (from main only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  toolchain: 1.99.0

jobs:
  # Which bundle legs to run: all of them on tags and default dispatches,
  # one platform in iteration mode. A matrix cannot be filtered by a
  # job-level `if` (matrix context is unavailable there), so the include
  # list is computed here and consumed via fromJSON.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.pick.outputs.include }}
      publishes: ${{ steps.version.outputs.publishes }}
      profile: ${{ steps.version.outputs.profile }}
      warm: ${{ steps.version.outputs.warm }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Crates publish under the workspace version, never the tag, so a tag
      # publishes only when it names that version exactly: `v0.19.0` for
      # 0.19.0, `v0.19.0-rc.8` for 0.19.0-rc.8. A final tag that does not
      # match is a mistake and stops the release; a release candidate that
      # does not match ships bundles without publishing.
      #
      # A final tag (no `-`) builds its bundles with one codegen unit and LTO;
      # everything else uses Cargo's default release profile, as `cargo
      # install` does. A scheduled run only warms the dependency cache.
      - id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tag="${{ github.ref_name }}"
          publishes=false
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = true ]; then
            if [ "$tag" = "v$version" ]; then
              publishes=true
            elif [ "${tag#*-}" = "$tag" ]; then
              echo "::error::tag $tag does not match the workspace version $version"
              exit 1
            else
              echo "::notice::tag $tag is not the workspace version $version; crates will not be published"
            fi
          fi
          profile=default
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = true ] && [ "${tag#*-}" = "$tag" ]; then
            profile=full
          fi
          echo "publishes=$publishes" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "warm=${{ github.event_name == 'schedule' }}" >> "$GITHUB_OUTPUT"

      - id: pick
        run: |
          linux='{"os":"ubuntu-latest","triple":"x86_64-unknown-linux-gnu","glibc_target":"x86_64-unknown-linux-gnu.2.31","rpath":"-C link-arg=-Wl,-rpath,$ORIGIN","link":"-C link-arg=-Wl,--allow-shlib-undefined","archive":"tar.zst"}'
          macos='{"os":"macos-14","triple":"aarch64-apple-darwin","rpath":"-C link-arg=-Wl,-rpath,@loader_path","archive":"zip"}'
          windows='{"os":"windows-latest","triple":"x86_64-pc-windows-msvc","rpath":"","lto":"off","archive":"zip"}'
          case "${{ github.event_name == 'schedule' && 'macos' || github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}" in
            linux)   list="[$linux]" ;;
            macos)   list="[$macos]" ;;
            windows) list="[$windows]" ;;
            *)       list="[$linux,$macos,$windows]" ;;
          esac
          echo "include=$list" >> "$GITHUB_OUTPUT"

  # Nothing ships unless the end-to-end tier is green: the SDK builds, a game
  # binary builds and loads an authored scene over PIE. It runs beside the
  # bundles; publish and the GitHub release wait for it. A final tag skips
  # it: the release candidate it follows already passed it, and the final
  # reruns only the bundles, their smoke test, the install journeys and the
  # publish checks.
  heavy:
    if: ${{ (github.event_name == 'push' && contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && !inputs.skip_heavy) }}
    uses: ./.github/workflows/heavy-tier.yaml

  # A scaffolded project depends on the public jackdaw crates by version.
  # Scaffold with an editor built as the bundles are, then resolve against the
  # packaged crates, so a project from this release is known to resolve before
  # anything is published. The projects are kept for `published-resolves`.
  scaffold-resolves:
    name: Scaffolded projects resolve
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JACKDAW_RELEASE_BUILD: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Package the crates
        run: cargo xtask package "$RUNNER_TEMP/packages"

      # Copied out of the checkout, so it scaffolds as an installed editor
      # does rather than pointing the project at this checkout.
      - name: Build jd
        run: |
          cargo build --bin jd
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/debug/jd "$RUNNER_TEMP/bin/"

      - name: Scaffold and resolve against the packaged crates
        working-directory: ${{ runner.temp }}/packages
        run: |
          set -euo pipefail
          mkdir -p projects
          "$RUNNER_TEMP/bin/jd" new release-game --path projects --no-git
          "$RUNNER_TEMP/bin/jd" new release-extension --path projects --no-git --extension
          for project in release-game:jackdaw_runtime release-extension:jackdaw_extension; do
            dir="projects/${project%%:*}"
            crate="${project##*:}"
            grep -E "^$crate = \{ version = " "$dir/Cargo.toml"
            manifest=$(cd "$dir" && cargo metadata --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .manifest_path')
            case "$manifest" in
              "$RUNNER_TEMP/packages/src/"*) echo "$dir resolves $crate from $manifest" ;;
              *) echo "::error::$dir resolved $crate from '$manifest', not the packaged crate"; exit 1 ;;
            esac
          done

      - name: Keep the projects
        uses: actions/upload-artifact@v4
        with:
          name: scaffolded-projects
          path: ${{ runner.temp }}/packages/projects
          retention-days: 7

  # The same projects, resolved from crates.io once the crates are there.
  published-resolves:
    name: Scaffolded projects resolve from crates.io
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.publishes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}

      - name: Download the projects
        uses: actions/download-artifact@v4
        with:
          name: scaffolded-projects
          path: projects

      - name: Resolve
        run: |
          set -euo pipefail
          for dir in projects/*/; do
            rm -f "$dir/Cargo.lock"
            (cd "$dir" && cargo metadata --format-version 1 > /dev/null)
            echo "$dir resolves"
          done

  # A release installs and sets up as a new user's machine would, on every
  # platform a bundle ships for. Nothing waits for it. It starts after heavy
  # so the bundles take their macOS runners first.
  install:
    needs: [plan, heavy]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.plan.result == 'success' && (needs.heavy.result == 'success' || needs.heavy.result == 'skipped') }}
    uses: ./.github/workflows/install-contract.yaml
    with:
      journey: true
      platforms: '["ubuntu-latest", "windows-latest", "macos-latest"]'

  # Every publishable crate builds from its packaged sources before anything
  # is uploaded.
  packages:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/packages.yaml

  # Publishes every crate that is not `publish = false`: the editor and
  # `jd-mcp` for `cargo install`, and everything a scaffolded project or an
  # extension depends on. `cargo xtask publish` orders them by dependency,
  # skips versions already on crates.io and waits out rate limits, so a run
  # cut short is finished by re-running the job.
  publish:
    name: Publish to crates.io
    needs: [plan, heavy, packages, scaffold-resolves]
    # Only a tag naming the workspace version exactly, so a release
    # candidate publishes as its prerelease version and never as the final
    # one. crates.io has no unpublish.
    if: ${{ !cancelled() && needs.plan.outputs.publishes == 'true' && needs.packages.result == 'success' && needs.scaffold-resolves.result == 'success' && (needs.heavy.result == 'success' || (needs.heavy.result == 'skipped' && !contains(github.ref_name, '-'))) }}
    runs-on: ubuntu-latest
    # New crates are rate limited to a few at a time, then one every ten
    # minutes.
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo xtask publish

  # Downloadable per-platform bundles: the editor, its CLI, the rustc
  # wrapper, the runtime dylibs, and a relocatable SDK, all in one archive.
  # A user extracts and runs offline - no bootstrap compile, no source
  # checkout. Independent of the crates.io publish.
  binaries:
    name: Bundle - ${{ matrix.triple }}
    needs: [plan]
    runs-on: ${{ matrix.os }}
    # The bundled editor is the one whose scaffolds ship, and this job is
    # the only place that knows its crates are on their way to the
    # registry. Without the flag the build reads as a git build, and
    # every project it set up would be pinned to the release commit
    # rather than to the release.
    #
    # Linux links against glibc 2.31 rather than the runner's own, so the
    # bundle starts on older distributions. cargo-zigbuild drives every
    # cargo invocation that compiles the shipped graph, with zig as the C
    # compiler and linker for that target. zig is a tool of this job only.
    env:
      JACKDAW_RELEASE_BUILD: "1"
      CARGO_FRONTEND: ${{ matrix.glibc_target && 'cargo-zigbuild' || 'cargo' }}
      BUILD_TARGET: ${{ matrix.glibc_target || matrix.triple }}
    # This job builds the editor once for the binaries, then an extension
    # against the staged SDK. A cold macOS or Windows runner can still take
    # hours, and a job cut off by its limit reports only `cancelled`.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}
          targets: ${{ matrix.triple }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10

      # The tracked cargo config links Linux builds through clang and wild.
      - name: Install cargo binstall (Linux)
        if: runner.os == 'Linux'
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild (Linux)
        if: runner.os == 'Linux'
        run: cargo binstall wild-linker --locked --force

      - name: Install zig (Linux)
        if: matrix.glibc_target
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Install cargo-zigbuild (Linux)
        if: matrix.glibc_target
        run: cargo binstall cargo-zigbuild@0.23.4 --locked --force

      # cargo-zigbuild covers target units and `cc`-built C. Two things sit
      # outside it: proc macros are host units, which the bundle ships for a
      # user's rustc to load, so cargo's host config links them through zig
      # too; and manifold-csg-sys runs cmake itself, which picks its
      # compilers from CC and CXX rather than cargo-zigbuild's toolchain file.
      - name: Point host links and cmake at zig (Linux)
        if: matrix.glibc_target
        run: |
          floor="${{ matrix.glibc_target }}"
          for tool in cc c++; do
            printf '#!/bin/sh\nexec cargo-zigbuild zig %s -- -g -fno-sanitize=all -target x86_64-linux-gnu.%s "$@"\n' "$tool" "${floor##*gnu.}" > "$RUNNER_TEMP/zig-$tool"
            chmod +x "$RUNNER_TEMP/zig-$tool"
          done
          echo "CC=$RUNNER_TEMP/zig-cc" >> "$GITHUB_ENV"
          echo "CXX=$RUNNER_TEMP/zig-c++" >> "$GITHUB_ENV"
          echo "CARGO_UNSTABLE_HOST_CONFIG=true" >> "$GITHUB_ENV"
          echo "CARGO_HOST_LINKER=$RUNNER_TEMP/zig-cc" >> "$GITHUB_ENV"

      # Saved only from main (the schedule, or a dispatch asking for it), so
      # tags restore it. rust-cache adds the lockfile and the env to the
      # key; the profile is named here because it is pinned after this step.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.save_cache == true) }}
          shared-key: bundle-${{ runner.os }}-${{ needs.plan.outputs.profile }}
          # The cargo config is in the key because it carries rustflags
          # (the linker choice and its flags): a cache built under
          # different flags restores artifacts whose crate disambiguators
          # no longer match what a fresh build produces, and the mix
          # surfaces as undefined `type_info::CELL` symbols at link time.
          key: ${{ matrix.glibc_target || matrix.triple }}-${{ hashFiles('.cargo/config.toml') }}
          # xtask is a detached workspace with its own target dir, which
          # the default cache paths do not cover: the bundler rebuilt
          # cold on every run, which was most of the staging step's
          # 15-27 minutes.
          workspaces: |
            . -> target
            xtask -> target
          # Save even when the job fails. This job is where a platform
          # gets iterated on, and the default is to save nothing unless
          # it succeeds: the two platforms that were failing therefore
          # never once had a warm cache, so every attempt rebuilt from
          # scratch and Windows spent 75 minutes on the same step twice
          # in a row. The build is the same work whether the test after
          # it passed.
          cache-on-failure: true

      # Final bundles build with one codegen unit and thin LTO, or the
      # platform's LTO override, which take more memory than `cargo install`
      # is given. Pinned for every cargo invocation in the job: the smoke
      # check builds its extension at release too, and a step that resolved a
      # different profile would rebuild the graph and mix artifact generations.
      - name: Pin the release profile for the whole job
        if: needs.plan.outputs.profile == 'full'
        run: |
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_LTO=${{ matrix.lto || 'thin' }}" >> "$GITHUB_ENV"

      # Every cargo invocation in this job, not just the one that builds
      # the binaries: the later steps rebuild the same graph, and a
      # differing RUSTFLAGS both invalidates all of it and leaves the
      # staged SDK dylib without the runtime search path it needs to
      # find libstd beside itself. Skipped where the value is empty,
      # because setting RUSTFLAGS at all would discard the rust-lld
      # flags `.cargo/config.toml` supplies for the MSVC target.
      # Single quotes, or bash expands the undefined `$ORIGIN` inside the
      # flag to an empty string and every shipped Linux binary loses its
      # runpath: the dylibs sit beside it and the loader still reports
      # them "not found".
      #
      # The glibc-target leg also allows undefined symbols inside the shared
      # libraries it links against: the runner's libasound and libudev were
      # built against its newer glibc, and on the user's machine their own
      # copies, built against that machine's glibc, are what load.
      - name: Pin the runtime search path for the whole job
        if: matrix.rpath != ''
        run: echo 'RUSTFLAGS=${{ matrix.rpath }} ${{ matrix.link }}' >> "$GITHUB_ENV"

      # The rustc wrapper is a HOST tool (cargo runs it as RUSTC_WRAPPER);
      # built without --target so it lands in target/release, where the
      # bundler's SdkPaths looks for it.
      - name: Build rustc wrapper (host)
        if: '!matrix.glibc_target'
        run: cargo build --release -p jackdaw_rustc_wrapper

      # The root package owns the editor, jd, and installed wrapper. The
      # artifact list is kept for the bundler, which would otherwise build
      # again to learn it.
      - name: Build installed binaries (target)
        run: $CARGO_FRONTEND build --release --target "$BUILD_TARGET" -p jackdaw --features dylib --bins --message-format=json-render-diagnostics > "$RUNNER_TEMP/bundle-build.json"

      # Under the glibc target the shipped wrapper is the root package's
      # own, built above against the same glibc, placed where the bundler
      # looks for the host one.
      - name: Place the rustc wrapper (Linux)
        if: matrix.glibc_target
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.triple }}/release/jackdaw-rustc-wrapper" target/release/

      # A PE export table addresses its entries with a 16-bit ordinal, so
      # 65,535 is the format's ceiling and no linker escapes it.
      # Each shared Rust library has its own PE export table. Keep every one
      # below a conservative ceiling so a future dependency cannot silently
      # recombine the split and fail only at the final Windows link.
      - name: Check shared DLL PE export headroom
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          readobj="$(rustc --print sysroot)/lib/rustlib/${{ matrix.triple }}/bin/llvm-readobj"
          shopt -s nullglob
          bevy_dlls=("target/${{ matrix.triple }}/release/deps/bevy_dylib"*.dll)
          jackdaw_dlls=("target/${{ matrix.triple }}/release/deps/jackdaw_dylib"*.dll)
          if [ "${#bevy_dlls[@]}" -eq 0 ] || [ "${#jackdaw_dlls[@]}" -eq 0 ]; then
            echo "expected separate Bevy and Jackdaw runtime DLLs"
            exit 1
          fi
          dlls=("target/${{ matrix.triple }}/release/jackdaw_sdk.dll" "${bevy_dlls[@]}" "${jackdaw_dlls[@]}")
          for dll in "${dlls[@]}"; do
            exports=$("$readobj" --coff-exports "$dll" | grep -c "  Ordinal:")
            echo "$(basename "$dll") exports $exports symbols of the 65535 a PE file can hold"
            if [ "$exports" -gt 60000 ]; then
              echo "under 5000 from the ceiling; split the DLL or shrink its public surface"
              exit 1
            fi
          done

      # Built ahead of staging so a cache-warming run stores it too.
      - name: Build the bundler
        run: |
          if [ -n "${{ matrix.glibc_target }}" ]; then
            cargo-zigbuild build --quiet --package xtask --manifest-path xtask/Cargo.toml --target "$BUILD_TARGET"
          else
            cargo build --quiet --package xtask --manifest-path xtask/Cargo.toml
          fi

      # A cache-warming run stops here.
      - name: Stage the bundle
        if: needs.plan.outputs.warm != 'true'
        # RUNNER_TEMP is outside the source checkout. Running `jd` from here
        # therefore exercises installed behavior and cannot accidentally
        # rewrite scaffolded manifests to local path dependencies.
        #
        # The bundler reads the SDK's artifacts from the build step's saved
        # JSON instead of building again. A second build compiled the editor
        # again whenever its environment differed from the first.
        run: |
          out="$RUNNER_TEMP/jackdaw-${{ matrix.triple }}"
          artifacts="$RUNNER_TEMP/bundle-build.json"
          if [ -n "${{ matrix.glibc_target }}" ]; then
            cargo-zigbuild run --quiet --package xtask --manifest-path xtask/Cargo.toml --target "$BUILD_TARGET" -- bundle --out "$out" --workspace . --artifacts "$artifacts"
          else
            cargo xtask bundle --out "$out" --workspace . --artifacts "$artifacts"
          fi

      # A binary that needs a newer glibc than the target names fails at the
      # loader on an older distribution, which the runner itself never shows.
      - name: Verify the staged binaries' glibc floor (Linux)
        if: needs.plan.outputs.warm != 'true' && matrix.glibc_target
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/jackdaw-${{ matrix.triple }}"
          floor="${{ matrix.glibc_target }}"
          floor="${floor##*gnu.}"
          fail=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^ELF' || continue
            need=$(objdump -T "$f" | { grep -o 'GLIBC_[0-9.]*' || true; } | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "${f#$root/}: glibc ${need:-none}"
            if [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" "$floor" | sort -V | tail -1)" != "$floor" ]; then
              echo "::error::${f#$root/} needs glibc $need, above $floor"; fail=1
            fi
          done < <(find "$root" -type f \( -perm -u+x -o -name '*.so' \) -print0)
          exit "$fail"

      # A binary that links the runtime dylibs but carries no `$ORIGIN`
      # runpath extracts fine and dies at the loader on the user's
      # machine; CI never notices because `cargo test` puts the build
      # tree on LD_LIBRARY_PATH.
      - name: Verify the staged binaries carry their runpath
        if: needs.plan.outputs.warm != 'true' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/jackdaw-${{ matrix.triple }}"
          for bin in jackdaw jd; do
            if ! readelf -d "$root/$bin" | grep -E 'RUNPATH|RPATH' | grep -qF '$ORIGIN'; then
              echo "$bin is missing its \$ORIGIN runpath:"
              readelf -d "$root/$bin" | head -20
              exit 1
            fi
          done

      # An archive that is missing a piece installs and then fails at the first
      # extension build, which is how a missing sdk/manifest.txt reached a user.
      - name: Verify the staged bundle
        if: needs.plan.outputs.warm != 'true'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/jackdaw-${{ matrix.triple }}"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          missing=0
          for f in sdk/manifest.txt Cargo.lock toolchain.txt \
                   "jackdaw$exe" "jd$exe" "jackdaw-rustc-wrapper$exe"; do
            if [ ! -f "$root/$f" ]; then echo "bundle is missing $f"; missing=1; fi
          done
          if [ ! -d "$root/sdk/${{ matrix.triple }}" ]; then
            echo "bundle is missing sdk/${{ matrix.triple }}"; missing=1
          fi
          if [ "$missing" -ne 0 ]; then echo "staged bundle is incomplete"; exit 1; fi
          echo "bundle layout verified"

      # Build an extension against the staged release SDK, the way an
      # installed user does. It runs from xtask, so the editor is not
      # compiled again for a test target. Under cargo-zigbuild the extension
      # build inherits the zig toolchain the staged SDK was linked with.
      - name: Bundle smoke (extension builds against the release SDK)
        if: needs.plan.outputs.warm != 'true'
        env:
          # On failure, the wrapper re-runs the failed unit with rustc's
          # crate-locator trace, so a rejected extern says why it was
          # rejected instead of a bare "can't find crate".
          JACKDAW_WRAPPER_EXPLAIN: "1"
        run: |
          bundle="$RUNNER_TEMP/jackdaw-${{ matrix.triple }}"
          if [ -n "${{ matrix.glibc_target }}" ]; then
            cargo-zigbuild run --quiet --package xtask --manifest-path xtask/Cargo.toml --target "$BUILD_TARGET" -- bundle-smoke --bundle "$bundle" --workspace .
          else
            cargo xtask bundle-smoke --bundle "$bundle" --workspace .
          fi

      - name: Archive (tar.zst)
        if: needs.plan.outputs.warm != 'true' && matrix.archive == 'tar.zst'
        run: tar --zstd -cf "jackdaw-${{ matrix.triple }}.tar.zst" -C "$RUNNER_TEMP" "jackdaw-${{ matrix.triple }}"

      - name: Archive (zip)
        if: needs.plan.outputs.warm != 'true' && matrix.archive == 'zip' && runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: 7z a "$GITHUB_WORKSPACE/jackdaw-${{ matrix.triple }}.zip" "./jackdaw-${{ matrix.triple }}"

      # ditto keeps the symlinks and executable bits Finder and unzip restore.
      - name: Archive (zip, macOS)
        if: needs.plan.outputs.warm != 'true' && matrix.archive == 'zip' && runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: ditto -c -k --keepParent "jackdaw-${{ matrix.triple }}" "$GITHUB_WORKSPACE/jackdaw-${{ matrix.triple }}.zip"

      - name: Generate checksum
        if: needs.plan.outputs.warm != 'true'
        run: openssl dgst -sha256 "jackdaw-${{ matrix.triple }}.${{ matrix.archive }}" > "jackdaw-${{ matrix.triple }}.${{ matrix.archive }}.sha256"

      - name: Keep the archive
        if: needs.plan.outputs.warm != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.triple }}
          path: |
            jackdaw-${{ matrix.triple }}.${{ matrix.archive }}
            jackdaw-${{ matrix.triple }}.${{ matrix.archive }}.sha256
          retention-days: 7
          compression-level: 0

  # The one-line installers, run against the archives this run built, served
  # from a local web server in place of the release: a piped install
  # configured by environment, an upgrade, a re-run and an uninstall, with
  # the commands checked from a new shell. Nothing waits for it.
  installers:
    name: Installer - ${{ matrix.triple }}
    needs: [plan, binaries]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.warm != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - name: Checkout the installers
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.triple }}
          path: ${{ runner.temp }}/dist

      - name: Install, upgrade and uninstall (install.sh)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: jackdaw-${{ matrix.triple }}.${{ matrix.archive }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          cp scripts/install.sh "$dist/"
          mkdir "$dist/tampered"
          cp "$dist/$ASSET" "$dist/tampered/"
          printf 'SHA2-256(%s)= %064d\n' "$ASSET" 0 > "$dist/tampered/$ASSET.sha256"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$dist" > "$RUNNER_TEMP/http.log" 2>&1 &
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          base=http://127.0.0.1:8765
          home="$RUNNER_TEMP/home dir"
          mkdir -p "$home"
          prefix="$home/.local/share/jackdaw/install"
          shell=bash
          if [ "$RUNNER_OS" = macOS ]; then shell=zsh; fi
          clean() { env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$@"; }
          fail() { echo "::error::$*"; exit 1; }

          echo "--- piped install, configured by environment"
          curl -LsSf "$base/install.sh" | clean JACKDAW_VERSION=0.0.0-ci.1 JACKDAW_DOWNLOAD_BASE="$base" sh
          clean "$shell" -lc 'jackdaw --version && jd --version'
          doctor=$(clean "$shell" -lc 'jd doctor' 2>&1 || true)
          echo "$doctor"
          echo "$doctor" | grep -F "SDK: release bundle ($prefix/0.0.0-ci.1/sdk/" || fail "jd did not find the installed SDK"

          echo "--- upgrade"
          clean sh scripts/install.sh --version 0.0.0-ci.2 --base-url "$base" --yes
          [ "$(readlink "$prefix/current")" = 0.0.0-ci.2 ] || fail "current is not the upgrade"
          [ "$(readlink "$prefix/previous")" = 0.0.0-ci.1 ] || fail "the previous version was not kept"

          echo "--- re-run"
          clean sh scripts/install.sh --version 0.0.0-ci.2 --base-url "$base"
          [ "$(readlink "$prefix/previous")" = 0.0.0-ci.1 ] || fail "a re-run dropped the previous version"
          for f in jackdaw jd jackdaw-rustc-wrapper toolchain.txt Cargo.lock sdk/manifest.txt "sdk/${{ matrix.triple }}"; do
            [ -e "$prefix/current/$f" ] || fail "installed folder is missing $f"
          done
          for f in "$home/.profile" "$home/.zshenv"; do
            if [ -f "$f" ] && [ "$(grep -c jackdaw-installer "$f")" -ne 1 ]; then fail "$f has a duplicate PATH line"; fi
          done
          clean "$shell" -lc 'jd --version'

          echo "--- uninstall"
          clean sh scripts/install.sh --uninstall
          [ ! -e "$prefix" ] || fail "$prefix is still there"
          [ ! -e "$home/.local/bin/jd" ] || fail "the jd launcher is still there"
          ! grep -rs jackdaw-installer "$home/.profile" "$home/.zshenv" "$home/.bashrc" || fail "a PATH line is still there"
          ! clean "$shell" -lc 'command -v jd' || fail "jd still resolves"

          echo "--- checksum mismatch"
          if clean sh scripts/install.sh --version 0.0.0-ci.3 --base-url "$base/tampered"; then fail "a tampered archive installed"; fi
          [ ! -e "$prefix" ] || fail "a failed install left $prefix behind"

      - name: Install, upgrade and uninstall (install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: jackdaw-${{ matrix.triple }}.${{ matrix.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          Copy-Item scripts/install.ps1 $dist
          New-Item -ItemType Directory (Join-Path $dist 'tampered') | Out-Null
          Copy-Item (Join-Path $dist $env:ASSET) (Join-Path $dist 'tampered')
          Set-Content (Join-Path $dist "tampered\$env:ASSET.sha256") "SHA2-256($env:ASSET)= $('0' * 64)"
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', "`"$dist`"" -NoNewWindow
          foreach ($i in 1..30) { try { Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 } }
          $base = 'http://127.0.0.1:8765'
          $prefix = Join-Path $env:LOCALAPPDATA 'jackdaw\install'
          $current = Join-Path $prefix 'current'
          function Fail([string]$Message) { throw $Message }
          function Get-RawUserPath {
            (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          }
          function Invoke-Fresh([string]$Command) {
            $saved = $env:Path
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
            try { cmd /c "$Command 2>&1" } finally { $env:Path = $saved }
          }

          # An existing unexpanded entry must survive every edit untouched.
          $sentinel = '%USERPROFILE%\jackdaw-ci-sentinel'
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $key.SetValue('Path', ((@($sentinel) + @((Get-RawUserPath) -split ';' | Where-Object { $_ })) -join ';'), 'ExpandString')
          $key.Close()

          Write-Host '--- Windows PowerShell, piped through iex, configured by environment'
          $env:JACKDAW_VERSION = '0.0.0-ci.1'
          $env:JACKDAW_DOWNLOAD_BASE = $base
          powershell -NoProfile -ExecutionPolicy Bypass -Command "irm $base/install.ps1 | iex"
          if ($LASTEXITCODE -ne 0) { Fail 'the piped install failed' }
          Remove-Item Env:JACKDAW_VERSION, Env:JACKDAW_DOWNLOAD_BASE
          Invoke-Fresh 'where jackdaw && jd --version'
          if ($LASTEXITCODE -ne 0) { Fail 'jackdaw is not on PATH in a new shell' }
          # The editor is a GUI-subsystem program, so wait on it explicitly.
          $editor = Start-Process (Join-Path $current 'jackdaw.exe') -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($editor.ExitCode -ne 0) { Fail "jackdaw --version exited with $($editor.ExitCode)" }
          $doctor = Invoke-Fresh 'jd doctor' | Out-String
          Write-Host $doctor
          if ($doctor -notmatch 'SDK: release bundle \(.*\\jackdaw\\install\\current\\sdk\\') { Fail 'jd did not find the installed SDK' }

          Write-Host '--- upgrade (PowerShell 7, parameters)'
          pwsh -NoProfile -File scripts/install.ps1 -Version 0.0.0-ci.2 -BaseUrl $base
          if ($LASTEXITCODE -ne 0) { Fail 'the upgrade failed' }
          if ((Split-Path -Leaf @((Get-Item $current).Target)[0]) -ne '0.0.0-ci.2') { Fail 'current is not the upgrade' }
          if ((Get-Content (Join-Path $prefix 'previous') -Raw).Trim() -ne '0.0.0-ci.1') { Fail 'the previous version was not kept' }

          Write-Host '--- re-run (Windows PowerShell)'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Version 0.0.0-ci.2 -BaseUrl $base
          if ($LASTEXITCODE -ne 0) { Fail 'the re-run failed' }
          foreach ($f in 'jackdaw.exe', 'jd.exe', 'jackdaw-rustc-wrapper.exe', 'toolchain.txt', 'Cargo.lock', 'sdk\manifest.txt', 'sdk\${{ matrix.triple }}') {
            if (-not (Test-Path (Join-Path $current $f))) { Fail "installed folder is missing $f" }
          }
          $entries = @((Get-RawUserPath) -split ';' | Where-Object { $_ -ieq $current })
          if ($entries.Count -ne 1) { Fail "the user PATH holds $($entries.Count) copies of $current" }
          if ((Get-RawUserPath) -notlike "*$sentinel*") { Fail 'an existing PATH entry was changed' }
          Invoke-Fresh 'jd --version'

          Write-Host '--- uninstall'
          pwsh -NoProfile -File scripts/install.ps1 -Uninstall
          if ($LASTEXITCODE -ne 0) { Fail 'the uninstall failed' }
          if (Test-Path $prefix) { Fail "$prefix is still there" }
          if ((Get-RawUserPath) -like "*$current*") { Fail 'the PATH entry is still there' }
          if ((Get-RawUserPath) -notlike "*$sentinel*") { Fail 'an existing PATH entry was removed' }
          if ((Get-Item HKCU:\Environment).GetValueKind('Path') -ne 'ExpandString') { Fail 'the PATH value changed type' }

          Write-Host '--- checksum mismatch'
          pwsh -NoProfile -File scripts/install.ps1 -Version 0.0.0-ci.3 -BaseUrl "$base/tampered"
          if ($LASTEXITCODE -eq 0) { Fail 'a tampered archive installed' }
          if (Test-Path $prefix) { Fail "a failed install left $prefix behind" }
          $global:LASTEXITCODE = 0

  # One release per tag, created once every bundle is built and, for a final
  # tag, once its crates are on crates.io. Pre-release tags never become the
  # latest release.
  github-release:
    name: GitHub release
    needs: [binaries, heavy, publish]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.binaries.result == 'success' && (needs.heavy.result == 'success' || (needs.heavy.result == 'skipped' && !contains(github.ref_name, '-'))) && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && contains(github.ref_name, '-'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the installers
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      # Attached to every release, so /releases/latest/download/install.sh
      # names the newest final release's installer.
      - name: Add the installers
        run: cp scripts/install.sh scripts/install.ps1 dist/

      - name: Attest the archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.zst
            dist/*.zip
            dist/install.sh
            dist/install.ps1

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
