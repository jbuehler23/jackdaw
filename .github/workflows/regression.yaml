name: Regression

on:
  schedule:
    - cron: "37 4 * * *"
    # Sundays: the install journey on Windows and macOS.
    - cron: "37 6 * * 0"
  push:
    tags: ["v*-rc.*"]
  workflow_dispatch: {}

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

env:
  toolchain: 1.99.0

jobs:
  # Release gates a tag on this same reusable workflow and runs the install
  # journeys itself, so a tag here runs only the cross-platform tiers.
  heavy:
    if: github.event_name != 'push' && github.event.schedule != '37 6 * * 0'
    uses: ./.github/workflows/heavy-tier.yaml

  install:
    if: github.event_name != 'push' && github.event.schedule != '37 6 * * 0'
    uses: ./.github/workflows/install-contract.yaml
    with:
      journey: true

  install-cross-platform:
    if: github.event.schedule == '37 6 * * 0'
    uses: ./.github/workflows/install-contract.yaml
    with:
      journey: true
      platforms: '["windows-latest", "macos-latest"]'

  # The tiers that do not need the SDK, on the platforms we ship bundles for.
  # This is where platform-specific path handling gets covered. On demand and
  # on release-candidate tags, not on a schedule: each leg takes about two hours.
  cross-platform:
    name: Fast + integration (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A cold Windows/macOS graph can spend more than an hour in the fast
    # tier alone. Give integration enough room to report a real result.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          toolchain: ${{ env.toolchain }}

      # Dependencies at opt-level 1 on the 3-core macOS runner: the tests run
      # the same code, and the build is far shorter than at opt-level 3.
      - name: Build dependencies at opt-level 1 (macOS)
        if: runner.os == 'macOS'
        run: printf '\n[profile.dev.package."*"]\nopt-level = 1\n' >> .cargo/config.toml

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Fast tier (fmt, clippy, lib tests)
        run: cargo xtask fast

      - name: Integration tier
        run: cargo xtask integration
