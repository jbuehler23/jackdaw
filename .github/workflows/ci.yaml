name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Pull requests only restore caches. This daily run on main saves any that
  # were pushed out. Only the jobs on a pull request's longest path keep a
  # cache, so the saved keys fit the repository's 10 GB together. Off the
  # hour, where scheduled runs start hours late.
  schedule:
    - cron: "17 2 * * *"

# A new push to a pull request replaces its run; runs on main each finish, so
# the post-merge checks report on every merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use the same Rust toolchain across jobs so they can share a cache.
  # Keep this in sync with rust-toolchain.toml.
  toolchain: 1.99.0
  CARGO_INCREMENTAL: "0"

jobs:
  # The checks that build the editor without the SDK dylib, the way a
  # `cargo install` does, plus the doctests.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Remove unused software
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          toolchain: ${{ env.toolchain }}
      - name: Set LD_LIBRARY_PATH
        run: |
          echo "LD_LIBRARY_PATH=$(rustc --print target-libdir)" >> $GITHUB_ENV

      # Restores the archive job's cache rather than keeping a 4 GB one of
      # its own, which pushed the saved keys past the 10 GB limit. Most of
      # the dependency graph builds the same without the `dylib` feature.
      - name: Populate target directory from cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          shared-key: build-tests

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The create/import flows as a user meets them: the `jd` binary
      # run from outside any checkout, with only its embedded templates.
      # Required here, so a binary that cannot scaffold fails CI instead
      # of skipping quietly.
      - name: Standalone scaffold and import
        env:
          JACKDAW_STANDALONE_REQUIRED: "1"
        run: cargo test --locked --test standalone_scaffold

      # The recipe is only unpacked on a user's machine at first run, so
      # a malformed one passes every other check and then leaves them
      # with no SDK and no way to build any project.
      - name: Embedded SDK recipe is loadable
        env:
          JACKDAW_RECIPE_REQUIRED: "1"
        run: cargo test --locked --test sdk_recipe

      - name: Run doctests
        run: cargo test --locked --workspace --doc --features bevy/dynamic_linking

  # Every library and integration test binary, built once for the shards.
  build-tests:
    name: Build tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Remove unused software
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          toolchain: ${{ env.toolchain }}
      - name: Set LD_LIBRARY_PATH
        run: |
          echo "LD_LIBRARY_PATH=$(rustc --print target-libdir)" >> $GITHUB_ENV

      - name: Populate target directory from cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: build-tests

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Archive the test binaries
        run: cargo xtask archive "$RUNNER_TEMP/tests.tar.zst"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: tests
          path: ${{ runner.temp }}/tests.tar.zst
          retention-days: 1
          compression-level: 0

  # The library and integration tests from the archive, spread over runners.
  # The `*_REQUIRED` variables turn a skip into a failure wherever the shard
  # holding those tests runs:
  # - the standalone scaffold needs a `jd` it can copy out of the checkout;
  # - the embedded recipe must be loadable;
  # - an SDK prepared from that recipe resolves fewer features than the
  #   editor's own graph, so a project resolving more would compile against
  #   SDK rlibs built without them.
  integration:
    name: Integration ${{ matrix.shard }}/6
    needs: build-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      JACKDAW_STANDALONE_REQUIRED: "1"
      JACKDAW_RECIPE_REQUIRED: "1"
      JACKDAW_FEATURE_SUPERSET_REQUIRED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Remove unused software
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          toolchain: ${{ env.toolchain }}
      - name: Set LD_LIBRARY_PATH
        run: |
          echo "LD_LIBRARY_PATH=$(rustc --print target-libdir)" >> $GITHUB_ENV

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: tests
          path: ${{ runner.temp }}

      - name: Check the archive
        id: archive
        continue-on-error: true
        run: zstd -t "$RUNNER_TEMP/tests.tar.zst"

      - name: Remove the damaged archive
        if: steps.archive.outcome == 'failure'
        run: rm -f "$RUNNER_TEMP/tests.tar.zst"

      - name: Download the archive again
        if: steps.archive.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: tests
          path: ${{ runner.temp }}

      - name: Integration tier
        run: cargo xtask integration ${{ matrix.shard }}/6 --archive "$RUNNER_TEMP/tests.tar.zst"

  # Play builds a game with cargo and runs it, which is the heavy tier's cost,
  # so pull requests run it only when they touch the Play pipeline.
  play-paths:
    name: Play pipeline changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          pattern='^(src/pie|crates/jackdaw_project_build/|crates/jackdaw_pie_protocol/|crates/jackdaw_runtime/|crates/jackdaw_rustc_wrapper/|tests/bsn_game_run\.rs|tests/fixtures/bsn_game/|\.github/workflows/ci\.yaml)'
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE "$pattern"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  play:
    name: Play
    needs: play-paths
    if: needs.play-paths.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove unused software
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          toolchain: ${{ env.toolchain }}

      - name: Set LD_LIBRARY_PATH
        run: |
          echo "LD_LIBRARY_PATH=$(rustc --print target-libdir)" >> $GITHUB_ENV

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev mesa-vulkan-drivers
        timeout-minutes: 10

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: A built game loads and plays its scene
        run: cargo nextest run --profile heavy --cargo-profile dev -p jackdaw --features dylib --target x86_64-unknown-linux-gnu --test bsn_game_run

  # Packaging checks the whole graph from the packaged sources, so pull requests
  # run it only when they touch a manifest or the release tooling.
  package-paths:
    name: Package manifests changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          pattern='(^|/)Cargo\.(toml|lock)$|^xtask/|^\.github/workflows/(ci|packages|release)\.yaml$'
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE "$pattern"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  packages:
    needs: package-paths
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.package-paths.outputs.changed == 'true') }}
    uses: ./.github/workflows/packages.yaml

  templates:
    name: Template - ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        template:
          - game
          - extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          toolchain: ${{ env.toolchain }}

      - name: Set LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=$(rustc --print target-libdir)" >> $GITHUB_ENV

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Install nextest
        run: cargo binstall cargo-nextest --locked --force

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10

      - name: Populate target directory from cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: template

      # Scaffolded by a `jd` built as the release bundles are and copied out
      # of the checkout, so the project states the registry versions a user
      # gets. It sits under the packaged crates, whose cargo config resolves
      # those versions to the packages built from this change.
      - name: Scaffold ${{ matrix.template }}
        run: |
          set -euxo pipefail
          template="${{ matrix.template }}"
          cargo xtask package "$RUNNER_TEMP/packages"
          JACKDAW_RELEASE_BUILD=1 cargo build --bin jd
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/packages/projects"
          cp target/debug/jd "$RUNNER_TEMP/bin/"
          cp -r .cargo "$RUNNER_TEMP/"
          extra=""
          if [ "$template" = "extension" ]; then extra="--extension"; fi
          "$RUNNER_TEMP/bin/jd" new "test-$template" --path "$RUNNER_TEMP/packages/projects" --no-git $extra
          echo "PROJECT=$RUNNER_TEMP/packages/projects/test-$template" >> "$GITHUB_ENV"

      - name: Run cargo fmt
        working-directory: ${{ env.PROJECT }}
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        working-directory: ${{ env.PROJECT }}
        run: cargo clippy --workspace --all-targets --target-dir "$GITHUB_WORKSPACE/target" --features bevy/dynamic_linking -- --deny warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT }}
        run: |
          if [[ -d tests ]]; then
            cargo nextest run --workspace --lib --bins --tests --no-fail-fast --no-tests warn --features bevy/dynamic_linking --target-dir "$GITHUB_WORKSPACE/target"
          else
            echo "no tests/ directory in scaffolded ${{ matrix.template }}; skipping"
          fi

  # Run clippy lints.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: clippy
          toolchain: ${{ env.toolchain }}

      - name: Set LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=$(rustc --print target-libdir)" >> $GITHUB_ENV

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10

      - name: Run clippy lints
        run: cargo clippy --locked --workspace --all-targets --features dylib -- --deny warnings

  # Check formatting.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: ${{ env.toolchain }}

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  # Check documentation.
  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}

      - name: Set LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=$(rustc --print target-libdir)" >> $GITHUB_ENV

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10

      - name: Check documentation
        run: cargo doc --locked --workspace --document-private-items --no-deps

  # Run Bevy lints.
  bevy-lint:
    name: Bevy linter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # bevy_lint builds against rustc internals, so it runs on the nightly
    # its pinned revision requires rather than the workspace toolchain.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-03-05
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustc-dev, llvm-tools-preview
          toolchain: nightly-2026-03-05

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10

      - name: Install Bevy linter
        # Pinned to a known-good commit: installing from a release tag requires that
        # release's exact nightly, while unpinned HEAD lets upstream regressions
        # break CI without any code change in this repo.
        run: cargo install --git https://github.com/TheBevyFlock/bevy_cli --rev 6e65200ca13b89c212499324513248db46d0edc7 --locked bevy_lint

      - name: Active CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Run Bevy linter
        run: bevy_lint --locked --workspace --all-targets --features bevy/dynamic_linking
