name: Heavy tier

# Reusable: called by regression.yaml (nightly, tags) and by release.yaml,
# which gates publishing on it. Kept in its own file so the release gate and
# the nightly run the same definition.
on:
  workflow_call: {}

env:
  toolchain: nightly-2026-03-05
  CARGO_INCREMENTAL: "0"

jobs:
  heavy:
    name: SDK build + end-to-end tests
    # Linux only. The heavy tier builds the shared SDK/runtime graph for
    # extensions and runs game binary Play out of process; that path is
    # verified here, and the CI cargo config's linker is Linux-only.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The SDK dylib and the editor binary are multi-hundred-MB artifacts;
      # the default runner image does not leave room for both.
      - name: Remove unused software
        run: |
          echo "Available storage before:"
          sudo df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Available storage after:"
          sudo df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          toolchain: ${{ env.toolchain }}

      - name: Set LD_LIBRARY_PATH
        run: |
          echo "LD_LIBRARY_PATH=$(rustc --print target-libdir)" >> $GITHUB_ENV

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends libasound2-dev libudev-dev libwayland-dev
        timeout-minutes: 10
      # This tier launches real games (`bsn_game_run`, `editor_journey`),
      # and a CI runner has no GPU. Without a software Vulkan driver the
      # game aborts inside `bevy_render` with `Unable to find a GPU!`
      # before it can connect back, which surfaced only as a 90 second
      # timeout. The onboarding workflow already installs this for the
      # same reason.
      - name: Install a software Vulkan driver
        run: sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends -y mesa-vulkan-drivers
        timeout-minutes: 10

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Heavy tier
        run: cargo xtask heavy
