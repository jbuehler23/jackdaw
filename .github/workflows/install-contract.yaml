name: Cargo install contract

# Reusable: called by ci.yaml on pushes to main and by regression.yaml
# nightly. The command shown in the installation guide must keep selecting
# one package and producing every public executable. A local path tests the
# commit under test without a network race against main.
on:
  workflow_call: {}

env:
  toolchain: nightly-2026-03-05

jobs:
  cargo-install:
    name: Cargo install contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove unused software
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}

      - name: Populate target directory from cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: install

      - name: Install dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev

      # The release profile links with thin LTO and one codegen unit, and the
      # CI config's parallel frontend multiplies each rustc's memory by the
      # core count. One frontend thread and two jobs keep the build inside
      # the runner's memory.
      - name: Activate CI cargo config
        run: |
          mv .cargo/config_ci.toml .cargo/config.toml
          sed -i 's/"-Zthreads=0"/"-Zthreads=1"/' .cargo/config.toml
          grep -q '"-Zthreads=1"' .cargo/config.toml

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Wild
        run: cargo binstall wild-linker --locked --force

      - name: Install the public package
        run: cargo install --path . --locked --jobs 2 --root "$RUNNER_TEMP/jackdaw-install"

      - name: Verify installed commands
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/jackdaw-install/bin"
          for command in jackdaw jd jackdaw-rustc-wrapper; do
            test -x "$root/$command"
          done
          "$root/jd" --version
          "$root/jackdaw" --version
