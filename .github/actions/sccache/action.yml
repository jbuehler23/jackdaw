name: Compiler cache
description: >-
  Restores the workspace rlibs Build tests saved on main and routes rustc
  through sccache for the rest of the job. Needs install-tools first, and runs
  after rust-cache, whose key hashes RUST* variables and must stay the one
  Build tests saved.
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/sccache
        key: sccache-build-tests-${{ github.run_id }}
        restore-keys: sccache-build-tests-
    - shell: bash
      run: |
        {
          echo "SCCACHE_DIR=$HOME/.cache/sccache"
          echo "SCCACHE_CACHE_SIZE=1G"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
        } >> "$GITHUB_ENV"
