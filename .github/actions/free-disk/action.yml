name: Free disk space
description: >-
  Removes preinstalled toolchains the jobs never use. By default the removal
  starts in the background; with `wait` the step blocks until it is done.
inputs:
  wait:
    description: Wait for a removal started earlier instead of starting one.
    default: "false"
runs:
  using: composite
  steps:
    - if: inputs.wait != 'true'
      shell: bash
      run: nohup sudo sh -c "rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch $RUNNER_TEMP/cleanup-done" >/dev/null 2>&1 &
    - if: inputs.wait == 'true'
      shell: bash
      run: |
        while [ ! -e "$RUNNER_TEMP/cleanup-done" ]; do sleep 2; done
        df -h /
