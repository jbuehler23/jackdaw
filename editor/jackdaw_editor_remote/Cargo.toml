[package]
name = "jackdaw_editor_remote"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Remote control server and remote game debugger for the Jackdaw scene editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"
readme = "../../README.md"
keywords = ["bevy", "editor", "remote"]
categories = ["game-development"]
include = ["src/**/*", "Cargo.toml"]

[dependencies]
jackdaw_editor_core = { package = "jackdaw_editor_core", version = "0.21.0-dev", path = "../jackdaw_editor_core", default-features = false }
bevy.workspace = true
anyhow.workspace = true
async-channel = "2"
jackdaw_api.workspace = true
jackdaw_api_internal.workspace = true
jackdaw_bsn.workspace = true
jackdaw_commands.workspace = true
jackdaw_env.workspace = true
jackdaw_feathers.workspace = true
jackdaw_geometry.workspace = true
jackdaw_pie_protocol = { version = "0.21.0-dev", path = "../../crates/jackdaw_pie_protocol", features = [
    "ipc",
] }
jackdaw_remote.workspace = true
jackdaw_runtime = { workspace = true, features = ["terrain", "tilemap"] }
jackdaw_scene_types.workspace = true
jackdaw_select.workspace = true
image.workspace = true
jackdaw_widgets.workspace = true
path-slash.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The features the root enables on the core, and not `default`, so the
# remote tests share the core `cargo build` and `cargo test` make instead
# of compiling one of their own.
jackdaw_editor_core = { package = "jackdaw_editor_core", version = "0.21.0-dev", path = "../jackdaw_editor_core", default-features = false, features = [
    "multiplayer",
    "camera_rig",
    "embed-recipe",
] }
base64.workspace = true
jackdaw_panels.workspace = true
jackdaw_prefab.workspace = true
jackdaw_terrain.workspace = true
tempfile = "3"

[lints]
workspace = true
