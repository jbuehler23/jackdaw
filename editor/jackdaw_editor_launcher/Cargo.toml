[package]
name = "jackdaw_editor_launcher"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Launcher, project select and new project screens for the Jackdaw scene editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"
readme = "../../README.md"
keywords = ["bevy", "editor", "launcher"]
categories = ["game-development"]
include = ["src/**/*", "Cargo.toml"]

[dependencies]
jackdaw_editor_core = { package = "jackdaw_editor_core", version = "0.20.2", path = "../jackdaw_editor_core", default-features = false }
bevy.workspace = true
bevy_window_chrome.workspace = true
dirs.workspace = true
dunce = "1.0.5"
jackdaw_api.workspace = true
jackdaw_api_internal.workspace = true
jackdaw_feathers.workspace = true
jackdaw_package.workspace = true
jackdaw_project_build.workspace = true
jackdaw_releases.workspace = true
jackdaw_scaffold.workspace = true
jackdaw_scene_types.workspace = true
rfd.workspace = true
serde_json.workspace = true
toml = "1"
toml_edit = "0.25"

[dev-dependencies]
# The features the root enables on the core, and not `default`, so the
# launcher tests share the core `cargo build` and `cargo test` make instead
# of compiling one of their own.
jackdaw_editor_core = { package = "jackdaw_editor_core", version = "0.20.2", path = "../jackdaw_editor_core", default-features = false, features = [
    "multiplayer",
    "camera_rig",
    "embed-recipe",
] }
jackdaw_env.workspace = true
tempfile = "3"

[lints]
workspace = true
