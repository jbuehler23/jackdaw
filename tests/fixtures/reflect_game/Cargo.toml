[package]
name = "reflect_game"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: detach from the jackdaw workspace this directory sits inside.
[workspace]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "serialize",
    "reflect_auto_register",
    "reflect_documentation",
    "bevy_log",
] }
jackdaw_runtime = { path = "../../../crates/jackdaw_runtime", default-features = false }
