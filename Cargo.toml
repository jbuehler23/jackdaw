[package]
name = "jackdaw"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "A 3D level editor built with Bevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"
readme = "README.md"
keywords = ["bevy", "editor", "3d", "level-editor"]
categories = ["game-development", "graphics"]
# Ship only what the published crate needs: the binaries and the re-export
# shim. The editor's sources and embedded assets ship in `jackdaw_editor_core`.
include = [
    "src/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
# The package now ships two binaries: `jackdaw` (the editor) and
# `jackdaw-rustc-wrapper` (the rustc interceptor used by scaffolded
# extension projects). `default-run` makes `cargo run` resolve to the
# editor without an explicit `--bin` flag; the wrapper still builds
# alongside via `cargo build` and is installed by `cargo install`.
default-run = "jackdaw"

[features]
# Source and `cargo install` builds are self-contained by default. Each
# feature is documented on `jackdaw_editor_core`, which implements it.
default = ["multiplayer", "camera_rig", "embed-recipe"]
multiplayer = ["jackdaw_editor_core/multiplayer"]
camera_rig = ["jackdaw_editor_core/camera_rig"]
dylib = ["jackdaw_editor_core/dylib"]
embed-recipe = ["jackdaw_editor_core/embed-recipe"]

[workspace]
members = [
    "crates/*",
    "editor/*",
    "examples/extension/dynamic_extension",
    "examples/extension/viewable_camera_extension",
    "tests/fixtures/test_fixture_extension",
]

[dependencies]
# The editor itself. Its library is named `jackdaw` so reflected type paths
# stay `jackdaw::...`; the rename keeps it apart from this package's own lib.
jackdaw_editor_core = { package = "jackdaw_editor_core", version = "0.20.2", path = "editor/jackdaw_editor_core", default-features = false }
jackdaw_editor_tile = { version = "0.20.2", path = "editor/jackdaw_editor_tile" }
jackdaw_editor_terrain = { version = "0.20.2", path = "editor/jackdaw_editor_terrain" }
jackdaw_editor_modelling = { version = "0.20.2", path = "editor/jackdaw_editor_modelling" }
jackdaw_editor_remote = { version = "0.20.2", path = "editor/jackdaw_editor_remote" }
jackdaw_editor_animation = { version = "0.20.2", path = "editor/jackdaw_editor_animation" }
jackdaw_editor_launcher = { version = "0.20.2", path = "editor/jackdaw_editor_launcher" }
bevy.workspace = true
# The wrapper's logic also lives in this crate's `[[bin]]` so that
# `cargo install jackdaw` ships `jackdaw-rustc-wrapper` next to the
# editor binary. Both binaries call into the same library entry
# point.
jackdaw_rustc_wrapper.workspace = true

# Every workspace crate inherits this version (`version.workspace = true`).
# It is anchored to Bevy's minor: 0.19.x targets Bevy 0.19, and bumps to
# 0.20.0 when the workspace moves to Bevy 0.20. Jackdaw's own patch number
# advances independently within a Bevy minor.
[workspace.package]
version = "0.20.2"
rust-version = "1.97.1"

[workspace.dependencies]
bevy = { version = "0.20", features = [
    "bevy_feathers",
    "bevy_scene",
    "bevy_dev_tools",
    "serialize",
    "debug",
    "bevy_remote",
    "file_watcher",
    "reflect_documentation",
    "reflect_functions",
    "jpeg",
] }
jackdaw_jsn = { version = "0.20.2", path = "crates/jackdaw_jsn" }
jackdaw_geometry = { version = "0.20.2", path = "crates/jackdaw_geometry" }
jackdaw_scene_types = { version = "0.20.2", path = "crates/jackdaw_scene_types" }
jackdaw_schema = { version = "0.20.2", path = "crates/jackdaw_schema" }
jackdaw_project_build = { version = "0.20.2", path = "crates/jackdaw_project_build" }
jackdaw_bsn = { version = "0.20.2", path = "crates/jackdaw_bsn" }
jackdaw_bind = { version = "0.20.2", path = "crates/jackdaw_bind" }
jackdaw_csg = { version = "0.20.2", path = "crates/jackdaw_csg" }
bevy_window_chrome = { version = "0.20.2", path = "crates/bevy_window_chrome" }
jackdaw_camera = { version = "0.20.2", path = "crates/jackdaw_camera" }
jackdaw_input = { version = "0.20.2", path = "crates/jackdaw_input" }
jackdaw_camera_rig = { version = "0.20.2", path = "crates/jackdaw_camera_rig" }
jackdaw_feathers = { version = "0.20.2", path = "crates/jackdaw_feathers" }
jackdaw_widgets = { version = "0.20.2", path = "crates/jackdaw_widgets" }
jackdaw_widgets_runtime = { version = "0.20.2", path = "crates/jackdaw_widgets_runtime", default-features = false }
jackdaw_commands = { version = "0.20.2", path = "crates/jackdaw_commands" }
jackdaw_terrain = { version = "0.20.2", path = "crates/jackdaw_terrain" }
jackdaw_remote = { version = "0.20.2", path = "crates/jackdaw_remote" }
jackdaw_snap = { version = "0.20.2", path = "crates/jackdaw_snap" }
jackdaw_recipe = { version = "0.20.2", path = "crates/jackdaw_recipe" }
jackdaw_select = { version = "0.20.2", path = "crates/jackdaw_select" }
jackdaw_uv = { version = "0.20.2", path = "crates/jackdaw_uv" }
jackdaw_pick = { version = "0.20.2", path = "crates/jackdaw_pick" }
jackdaw_hull = { version = "0.20.2", path = "crates/jackdaw_hull" }
jackdaw_material = { version = "0.20.2", path = "crates/jackdaw_material" }
jackdaw_surface = { version = "0.20.2", path = "crates/jackdaw_surface" }
jackdaw_node_graph = { version = "0.20.2", path = "crates/jackdaw_node_graph" }
jackdaw_animation = { version = "0.20.2", path = "crates/jackdaw_animation" }
jackdaw_animation_runtime = { version = "0.20.2", path = "crates/jackdaw_animation_runtime" }
jackdaw_fuzzy = { version = "0.20.2", path = "crates/jackdaw_fuzzy" }
jackdaw_localization = { version = "0.20.2", path = "crates/jackdaw_localization" }
jackdaw_data_path = { version = "0.20.2", path = "crates/jackdaw_data_path" }
jackdaw_tilemap = { version = "0.20.2", path = "crates/jackdaw_tilemap" }
jackdaw_tileset = { version = "0.20.2", path = "crates/jackdaw_tileset" }
glam = { version = "0.33", features = ["serde"] }
meshopt = "0.6"
noise = "0.9"
rand = "0.10"
serde = "1"
lucide-icons = "0.563"
serde_json = "1"
jackdaw_multiplayer = { version = "0.20.2", path = "crates/jackdaw_multiplayer" }
jackdaw_multiplayer_editor = { version = "0.20.2", path = "crates/jackdaw_multiplayer_editor" }
jackdaw_runtime = { version = "0.20.2", path = "crates/jackdaw_runtime" }
jackdaw_panels = { version = "0.20.2", path = "crates/jackdaw_panels" }
jackdaw_prefab = { version = "0.20.2", path = "crates/jackdaw_prefab" }
jackdaw_api = { version = "0.20.2", path = "crates/jackdaw_api" }
jackdaw_extension = { version = "0.20.2", path = "crates/jackdaw_extension" }
jackdaw_api_internal = { version = "0.20.2", path = "crates/jackdaw_api_internal" }
jackdaw_api_macros = { version = "0.20.2", path = "crates/jackdaw_api_macros" }
jackdaw_dylib = { version = "0.20.2", path = "crates/jackdaw_dylib" }
jackdaw_loader = { version = "0.20.2", path = "crates/jackdaw_loader" }
jackdaw_package = { version = "0.20.2", path = "crates/jackdaw_package" }
jackdaw_scaffold = { version = "0.20.2", path = "crates/jackdaw_scaffold" }
jd = { version = "0.20.2", path = "crates/jd" }
jackdaw_releases = { version = "0.20.2", path = "crates/jackdaw_releases" }
jackdaw_sdk = { version = "0.20.2", path = "crates/jackdaw_sdk" }
jackdaw_rustc_wrapper = { version = "0.20.2", path = "crates/jackdaw_rustc_wrapper" }
jackdaw_cli_internal = { version = "0.20.2", path = "crates/jackdaw_cli" }
jackdaw_env = { version = "0.20.2", path = "crates/jackdaw_env" }
rfd = "0.15"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
anyhow = { version = "1", default-features = false }
dirs = "6"
regex = "1"
pathdiff = "0.2"
path-slash = "0.2.1"
tracing = "0.1"
tracing-subscriber = "0.3"
winit = "0.30.13"
image = { version = "0.25.10", default-features = false, features = ["png", "hdr", "jpeg"] }
fluent = "0.16"
fluent_content = "0.0.5"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
[workspace.lints.clippy]
doc_markdown = "warn"

redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
unwrap_or_default = "warn"
disallowed_methods = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
print_stdout = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# see: https://github.com/bevyengine/bevy/pull/15375#issuecomment-2366966219
too_long_first_doc_paragraph = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
match_same_arms = "warn"
manual_let_else = "warn"
print_stderr = "warn"
redundant_closure_for_method_calls = "warn"

# TODO: enable these if you have time!
# undocumented_unsafe_blocks = "warn"

[dev-dependencies]
bevy.workspace = true
jackdaw_jsn.workspace = true
jackdaw_bsn.workspace = true
jackdaw_prefab.workspace = true
jackdaw_bind.workspace = true
jackdaw_geometry.workspace = true
jackdaw_scene_types.workspace = true
jackdaw_schema.workspace = true
jackdaw_project_build.workspace = true
jackdaw_scaffold.workspace = true
jackdaw_feathers.workspace = true
jackdaw_widgets.workspace = true
jackdaw_widgets_runtime = { workspace = true, features = ["feathers"] }
jackdaw_commands.workspace = true
jackdaw_terrain.workspace = true
jackdaw_remote.workspace = true
jackdaw_snap.workspace = true
jackdaw_tilemap.workspace = true
jackdaw_tileset = { workspace = true, features = ["render"] }
jackdaw_uv.workspace = true
jackdaw_surface.workspace = true
jackdaw_node_graph.workspace = true
jackdaw_animation.workspace = true
jackdaw_animation_runtime.workspace = true
jackdaw_multiplayer.workspace = true
jackdaw_panels.workspace = true
jackdaw_api.workspace = true
jackdaw_api_internal.workspace = true
jackdaw_loader.workspace = true
jackdaw_runtime = { workspace = true, features = ["terrain", "tilemap"] }
jackdaw_pie_protocol = { version = "0.20.2", path = "crates/jackdaw_pie_protocol", features = [
    "ipc",
] }
jackdaw_input.workspace = true
jackdaw_env.workspace = true
jackdaw_package.workspace = true
jackdaw_releases.workspace = true
serde.workspace = true
base64.workspace = true
dunce = "1.0.5"
toml = "1"
winit.workspace = true
image.workspace = true
libloading = "0.8"
serde_json.workspace = true
tempfile = "3"
path-slash.workspace = true
# Pulled in so cargo builds the fixture cdylib as part of the
# workspace test-target graph. `tests/dylib_loading.rs` dlopens the
# resulting `.so` by path - it doesn't reference the rlib side.
test_fixture_extension = { path = "tests/fixtures/test_fixture_extension" }

[lints]
workspace = true

[profile.dev]
opt-level = 1
lto = "off"
incremental = false
debug = "line-tables-only"

# Only the editor crates build incrementally; the crates in the SDK dylib do not.
[profile.dev.package.jackdaw]
incremental = true

[profile.dev.package.jackdaw_editor_core]
incremental = true

[profile.dev.package.jackdaw_editor_tile]
incremental = true

[profile.dev.package.jackdaw_editor_terrain]
incremental = true

[profile.dev.package.jackdaw_editor_modelling]
incremental = true

[profile.dev.package.jackdaw_editor_remote]
incremental = true

[profile.dev.package.jackdaw_editor_animation]
incremental = true

[profile.dev.package.jackdaw_editor_launcher]
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.dev.package.bevy_ptr]
debug-assertions = false

# Keep the SDK facade compact. Bevy and Jackdaw's runtime closure live in
# their own dylibs; this crate should never approach the PE export ceiling.
[profile.dev.package.jackdaw_sdk]
opt-level = 3
codegen-units = 1

# The release profile keeps Cargo's defaults so `cargo install` fits in a
# 16 GB machine; release bundles pin one codegen unit and thin LTO in
# release.yaml. The SDK facade keeps one codegen unit for the same reason as
# `[profile.dev.package.jackdaw_sdk]`.
[profile.release.package.jackdaw_sdk]
codegen-units = 1

# Thin shim that re-exports `jackdaw_rustc_wrapper::run()`. We turn
# off doc generation because rustdoc's output path collides with the
# `jackdaw_rustc_wrapper` lib crate's docs (cargo translates dashes
# to underscores), and the shim has nothing user-facing to document
# anyway.
# The core's library is also named `jackdaw` and owns the docs; this shim and
# the editor binary would otherwise overwrite them.
[lib]
doc = false

[[bin]]
name = "jackdaw"
path = "src/main.rs"
doc = false

[[bin]]
name = "jackdaw-rustc-wrapper"
path = "src/bin/jackdaw-rustc-wrapper.rs"
doc = false
