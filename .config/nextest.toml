[profile.default]
# Local runs: no retries, show output on failure.
failure-output = "immediate-final"
# Name any test still running after 30 s, so a slow one shows up in the log.
slow-timeout = "30s"
# The extension `sdk_layout` loads with dlopen, and the Rust dylibs the test
# binaries link, which `cargo xtask archive` gathers.
archive.include = [
    { path = "debug/deps/libtest_fixture_extension.so", relative-to = "target", on-missing = "error" },
    { path = "debug/archived-dylibs", relative-to = "target", on-missing = "warn" },
]

# Every test in these binaries builds a whole editor app. Unbounded, one
# process per core runs a many-core machine out of memory.
[test-groups]
editor-apps = { max-threads = 4 }

[[profile.default.overrides]]
filter = """
binary_id(jackdaw::stage) | binary_id(jackdaw::inspector) | binary_id(jackdaw::outliner)
| binary_id(jackdaw::operators) | binary_id(jackdaw::viewport) | binary_id(jackdaw::guards)
| binary_id(jackdaw::terrain) | binary_id(jackdaw::keymap) | binary_id(jackdaw::controls)
"""
test-group = "editor-apps"

[profile.ci]
# CI: retry the environment-flaky heavy/e2e tests, keep going to report all.
retries = 2
fail-fast = false
failure-output = "immediate-final"
final-status-level = "flaky"
# Report a test as slow every 30 s and stop it after 3 minutes.
slow-timeout = { period = "30s", terminate-after = 6 }

[profile.ci.junit]
# Per-test outcomes and durations, at target/nextest/ci/junit.xml.
path = "junit.xml"

[profile.heavy]
# The end-to-end tests each build a game and launch it. Run them one at a
# time: concurrently they peak several GB past what a CI runner has, and a
# staged bundle alone is ~3GB on disk.
retries = 2
fail-fast = false
failure-output = "immediate-final"
final-status-level = "flaky"
test-threads = 1
slow-timeout = "60s"
