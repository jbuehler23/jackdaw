# This config is used for the CI workflow.
# Feel free to also use it locally for fast builds if you have the required setup!

[alias]
xtask = "run --quiet --package xtask --manifest-path xtask/Cargo.toml --"

[unstable]
codegen-backend = true

# Cranelift compiles the workspace quickly. Dependencies keep LLVM at the
# workspace's opt-level: they are cached, and the editor tests spend most of
# their time in Bevy, which runs an order of magnitude slower from Cranelift.
[profile.dev]
codegen-backend = "cranelift"

[profile.release]
codegen-backend = "llvm"

# Mirrors the workspace config. The MSVC linker has a hard 65,535 PE export
# cap that jackdaw_sdk exceeds, so a Windows job adopting this file without
# the override fails to link.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-fuse-ld=lld",
    "-Zshare-generics=no",
]

[target.'cfg(target_os = "macos")']
rustflags = ["-Zshare-generics=no"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-Dwarnings",
    "-Cdebuginfo=line-tables-only",
    "-Clink-arg=--ld-path=wild",
    "-Zshare-generics=y",
    "-Zthreads=0",
]
rustdocflags = [
    "-Dwarnings",
    "-Clink-arg=--ld-path=wild",
    "-Zshare-generics=y",
    "-Zthreads=0",
]
