[package]
name = "jackdaw_runtime"
version.workspace = true
edition = "2024"
description = "Runtime scene loader for the Jackdaw editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "reflect_auto_register",
    "std",
    "serialize",
    "bevy_asset",
    "bevy_camera",
    "bevy_world_serialization",
    "bevy_log",
    "reflect_documentation",
    # The schema dump reads the game's function registry, which only
    # exists with bevy's function reflection on.
    "reflect_functions",
] }
jackdaw_bsn = { version = "0.19.0", path = "../jackdaw_bsn" }
# `IsA` references in a world scene resolve at load, so a shipped game shows
# the prefab the editor showed.
jackdaw_prefab = { version = "0.19.0", path = "../jackdaw_prefab" }
# Bindings are part of what a scene document carries, so the runtime evaluates
# them in both feature states. It brings `bevy_ui` (and the `bevy_text` and
# `bevy_sprite` it implies) into the headless build; none of those pull
# `bevy_render`, so `--no-default-features` stays render-free.
jackdaw_bind = { version = "0.19.0", path = "../jackdaw_bind" }
# A widget marker only survives a load if something registers its reflected
# default, and a widget only answers a click if something attaches the value
# observers. The editor and the game take both from here.
jackdaw_widgets_runtime = { version = "0.19.0", path = "../jackdaw_widgets_runtime", default-features = false }
jackdaw_schema ={ version = "0.19.0", path = "../jackdaw_schema", features = [
    "reflect",
] }
jackdaw_geometry = { version = "0.19.0", path = "../jackdaw_geometry", default-features = false }
jackdaw_scene_types = { version = "0.19.0", path = "../jackdaw_scene_types", default-features = false }
jackdaw_pie_protocol = { version = "0.19.0", path = "../jackdaw_pie_protocol", optional = true }
jackdaw_camera_rig = { version = "0.19.0", path = "../jackdaw_camera_rig", optional = true }
# Runtime collider bridge: the `AvianCollider` -> `Collider` conversion. Default
# features are kept so this resolves to the same build as the editor's dependency
# (no cargo recompile churn when alternating editor and game builds). The unused
# overlay gizmos are dead code in the game; a lean release build can override with
# `default-features = false`.
jackdaw_avian_integration = { version = "0.19.0", path = "../jackdaw_avian_integration", optional = true }
# Named directly as well as through the bridge: the terrain ground collider is
# built here from stored heights rather than from an authored `AvianCollider`.
# Workspace features, to resolve to the same build as the bridge and editor.
avian3d = { workspace = true, optional = true }
# The data model, sidecar decoder, splat material and clipmap mesher shared with
# the editor. Default features off, so a `navmesh`-only build takes the data
# half alone and `terrain` asks for the rendering half by name.
jackdaw_terrain = { version = "0.19.0", path = "../jackdaw_terrain", optional = true, default-features = false }
# Authored animation sets: the state machine a rig plays and the binding step
# that gives a body loaded from one file the clips exported in another.
jackdaw_animation_runtime = { version = "0.19.0", path = "../jackdaw_animation_runtime", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"

[features]
default = ["render"]
render = [
    "bevy/bevy_pbr",
    "bevy/bevy_render",
    "bevy/bevy_image",
    "jackdaw_geometry/render",
    "jackdaw_scene_types/render",
    # `bevy_feathers` depends on `bevy_render` outright, so the theme markers
    # an authored widget carries can only be registered in a rendering build.
    "jackdaw_widgets_runtime/feathers",
]
# Play-in-editor: connect to the editor over ipc-channel, stream the
# scene's ECS state, and apply control commands. Off by default so the
# protocol and ipc-channel stay out of the standalone runtime build.
# Frame capture renders the active camera rig offscreen and reads it
# back, which needs bevy's gpu readback (bevy_render) and Image
# (bevy_image) even when the `render` feature is off.
pie = [
    "dep:jackdaw_pie_protocol",
    "jackdaw_pie_protocol/ipc",
    "dep:jackdaw_camera_rig",
    "bevy/bevy_render",
    "bevy/bevy_image",
    "bevy/mesh_picking",
]
# Avian physics: build `Collider`s from authored `AvianCollider` components at
# runtime so brushes collide in the standalone game and in PIE, not only in the
# editor preview. Add `PhysicsPlugins` in your app to actually simulate.
# With `terrain` as well, the authored ground gets a heightfield collider under
# it; no separate feature gates that.
physics = ["dep:jackdaw_avian_integration", "dep:avian3d"]
# Draw the terrain a scene authored. Each `Terrain` entity's sidecar is read
# from beside the scene file, its material slots resolve against the project
# catalog, and the surface is built with the same splat material and clipmap
# mesher the editor uses. Off by default: a game with no terrain does not link
# the mesher or the shader.
terrain = ["render", "navmesh", "jackdaw_terrain/render"]
# Load the navmesh baked beside a scene, as a `JackdawNavmesh` on the scene
# root. Decoding only: nothing is meshed and nothing is drawn, so a server that
# validates moves takes this without `terrain`.
navmesh = ["dep:jackdaw_terrain"]
# Play the animation sets a scene authored. Bevy's own animation and glTF
# support come with it, since a set's clips are named animations in a glTF
# file and `gltf_animation` is what puts them on the loaded file at all. Off by
# default: a game with no rigs links neither.
animation = [
    "dep:jackdaw_animation_runtime",
    "bevy/bevy_animation",
    "bevy/bevy_gltf",
    "bevy/gltf_animation",
]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
# The cap the resolution tests drive the chain past.
jackdaw_prefab = { version = "0.19.0", path = "../jackdaw_prefab" }
# Ground-collider tests query the built collider through avian's spatial
# queries, so the test targets name it themselves.
avian3d = { workspace = true }
# Terrain tests build a sidecar to load back. Optional for the library, so the
# test targets name it themselves.
jackdaw_terrain = { version = "0.19.0", path = "../jackdaw_terrain" }
# The animation test reads the components a loaded set spawned with. Optional
# for the library, so the test target names it itself.
jackdaw_animation_runtime = { version = "0.19.0", path = "../jackdaw_animation_runtime" }
