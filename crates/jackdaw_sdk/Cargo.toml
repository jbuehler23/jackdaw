[package]
name = "jackdaw_sdk"
version.workspace = true
edition = "2024"
description = "Single proxy dylib shipped with jackdaw. Extensions link against this via `cargo rustc --extern bevy=libjackdaw_sdk.so --extern jackdaw_api=libjackdaw_sdk.so` so they share one compilation of bevy + jackdaw types with the editor."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[lib]
# `dylib` produces `libjackdaw_sdk.so` with a stable filename (no
# metadata hash), which is what extensions' DT_NEEDED will point
# at. `lib` keeps the rlib form for rustc to read metadata during
# type-checking consumers.
crate-type = ["lib", "dylib"]

[dependencies]
# Bevy is linked dynamically so it lands in its own `bevy_dylib` rather
# than inside this one. A Rust dylib exports its whole closure, and
# Bevy's closure alone is 43k symbols on Linux and more on Windows,
# where the PE export table tops out at 65535 ordinals. Keeping Bevy out
# of this library's export table is what lets it link at all there.
bevy = { workspace = true, features = ["dynamic_linking"] }
jackdaw_api.workspace = true
# Every feature a project can turn on, so the SDK's feature resolution
# is a superset of any project's.
#
# Cargo resolves features per package selection. This crate is what a
# packaged SDK is built from, so anything a project enables that the SDK
# did not gets compiled against SDK rlibs that were built without it: a
# default scaffolded project pulls `bevy_math/approx` through the
# physics integration, and against an SDK whose `glam` lacks `approx`
# that fails on missing trait impls in a crate the user never named.
# Depending on the whole runtime here also puts its closure in the SDK
# manifest, so projects redirect those crates instead of rebuilding
# them.
jackdaw_runtime = { workspace = true, features = ["render", "physics", "pie"] }

[lints]
workspace = true
