[package]
name = "jackdaw_releases"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Jackdaw's signed release index and the registry of installed editors, shared by jd and the editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[features]
# The `jackdaw-release-index` tool the release workflow runs to add a
# release to the published index and sign it.
index-tool = ["dep:base64"]

[[bin]]
name = "jackdaw-release-index"
path = "src/bin/jackdaw-release-index.rs"
required-features = ["index-tool"]
doc = false

[dependencies]
jackdaw_env.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ed25519-dalek = "2"
sha2 = "0.10"
semver = "1"
base64 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
