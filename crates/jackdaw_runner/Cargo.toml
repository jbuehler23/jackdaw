[package]
name = "jackdaw_runner"
version.workspace = true
edition = "2024"
description = "Prebuilt game runner and out-of-process schema extractor for the Jackdaw editor: turns a project dylib into a running game, or dumps its reflected type schema without mapping project code into the editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[[bin]]
name = "jackdaw-runner"
path = "src/main.rs"

[dependencies]
# Bevy-free by design: both Play (`jackdaw_run_game`) and schema
# extraction (`jackdaw_extract_schema`) are FFI calls into the project
# dylib, which carries the engine. Linking no bevy is what lets this
# binary link on Windows, where a secondary binary cannot resolve a
# dylib's private bevy statics.
libloading = "0.8"

[lints]
workspace = true
