[package]
name = "jackdaw_api"
version.workspace = true
edition = "2024"
description = "Public API for Jackdaw editor extensions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[features]
# The bevy feature set the editor, the SDK, and every project/extension
# share so they agree on `TypeId` for the types they both touch.
#
# NOTE: despite the name, this no longer enables `bevy/dynamic_linking` or
# the `jackdaw_dylib` proxy. jackdaw links bevy STATICALLY now: the rmeta
# trick redirects every consumer to the SAME prebuilt bevy rlibs, so one
# compilation is embedded rather than shared through a dll. That is the
# only model that links on Windows (a dll cannot export bevy's reflect
# statics). The name is kept because extension authors still write
# `features = ["dynamic_linking"]`.
#
# The bevy feature list must mirror what the jackdaw workspace activates
# for its own bevy dependency: feature unification means a different set
# produces a different bevy SVH, and the redirect only fires when the
# consumer's bevy is byte-identical to the SDK's.
dynamic_linking = [
    "bevy/bevy_feathers",
    "bevy/serialize",
    "bevy/debug",
    "bevy/bevy_remote",
    "bevy/file_watcher",
]

[dependencies]
bevy.workspace = true
bevy_enhanced_input.workspace = true
jackdaw_api_internal.workspace = true
jackdaw_api_macros.workspace = true
jackdaw_commands.workspace = true
jackdaw_feathers.workspace = true
jackdaw_scene_types.workspace = true
jackdaw_panels.workspace = true
jackdaw_widgets.workspace = true

[lints]
workspace = true
