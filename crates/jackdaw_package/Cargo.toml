[package]
name = "jackdaw_package"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Signed .jdext extension bundles for Jackdaw: format, verification and installation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
jackdaw_env.workspace = true
base64.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Pure Rust, so the editor builds no C or assembly for bundle checks.
ed25519-dalek = "2"
sha2 = "0.10"

[lints]
workspace = true
