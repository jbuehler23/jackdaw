[package]
name = "jackdaw_avian_integration"
version.workspace = true
edition = "2024"
description = "Internal crate for the jackdaw editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
# See `jackdaw_pie_protocol`: this crate ships inside games, so its bevy
# features unify into theirs. Keep the list minimal and explicit.
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "serialize",
    "reflect_auto_register",
    "bevy_asset",
    "bevy_mesh",
] }
avian3d = { workspace = true }
jackdaw_geometry = { version = "0.19.0", path = "../jackdaw_geometry" }
jackdaw_scene_types = { version = "0.19.0", path = "../jackdaw_scene_types" }

[features]
default = ["overlays"]
# Editor-only collider/sensor wireframe gizmos and hierarchy arrows. Pulls
# avian's `debug-plugin` (`PhysicsGizmoExt::draw_collider`, the `PhysicsGizmos`
# config group). The runtime collider bridge builds without it, which is why
# the gizmo dependency is gated here rather than always on: a shipped game
# takes the bridge and leaves bevy's gizmo stack behind.
overlays = ["avian3d/debug-plugin", "bevy/bevy_gizmos"]

[lints]
workspace = true
