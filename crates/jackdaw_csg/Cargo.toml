[package]
name = "jackdaw_csg"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Mesh-CSG glue between jackdaw brushes and the manifold-rust boolean kernel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
glam.workspace = true
jackdaw_geometry = { version = "0.20.0-dev", path = "../jackdaw_geometry", default-features = false }
manifold-rust = "0.16"

[dev-dependencies]
jackdaw_scene_types.workspace = true

[features]
default = ["render"]
render = ["jackdaw_geometry/render"]

[lints]
workspace = true
