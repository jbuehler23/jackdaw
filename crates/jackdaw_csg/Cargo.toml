[package]
name = "jackdaw_csg"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Mesh-CSG glue between jackdaw brushes and the manifold3d kernel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
glam.workspace = true
jackdaw_geometry = { version = "0.19.0", path = "../jackdaw_geometry", default-features = false }
# manifold-csg pulls in manifold3d (C++ via cmake). Build prereqs:
# cmake, a C++ compiler, git. See the crate README for details.
manifold-csg = { version = "0.3", default-features = false }

[dev-dependencies]
jackdaw_scene_types.workspace = true

[features]
default = ["render"]
render = ["jackdaw_geometry/render"]
# Manifold's TBB-backed parallelism. Off by default: brush meshes are below
# Manifold's parallel threshold, and building TBB roughly doubles the C++ build
# time and peak memory. TBB's static initializer also crashes when the kernel
# is loaded through dlopen.
parallel = ["manifold-csg/parallel"]

[lints]
workspace = true
