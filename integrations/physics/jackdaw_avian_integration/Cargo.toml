[package]
name = "jackdaw_avian_integration"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Avian physics for jackdaw games: colliders built from the colliders a scene authored"
license.workspace = true
repository.workspace = true

[package.metadata.jackdaw]
# The editor line this module is built for.
editor = "0.20"
# Why this module cannot build on the current Bevy; CI reports it instead
# of building. Remove once avian releases for Bevy 0.20.
unavailable = "avian has no Bevy 0.20 release yet (avianphysics/avian#1070 ports it)"

[dependencies]
# See `jackdaw_pie_protocol`: this crate ships inside games, so its bevy
# features unify into theirs. Keep the list minimal and explicit.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "serialize",
    "reflect_auto_register",
    "bevy_asset",
    "bevy_mesh",
] }
avian3d = { workspace = true }
jackdaw_geometry = { version = "0.20.0-dev", path = "../../../crates/jackdaw_geometry" }
jackdaw_scene_types = { version = "0.20.0-dev", path = "../../../crates/jackdaw_scene_types" }
# The heights a loaded terrain is drawn from, for its ground collider.
jackdaw_runtime = { version = "0.20.0-dev", path = "../../../crates/jackdaw_runtime", default-features = false, optional = true }
jackdaw_terrain = { version = "0.20.0-dev", path = "../../../crates/jackdaw_terrain", default-features = false, optional = true }

[features]
default = ["terrain"]
# A heightfield collider under every terrain a scene loads.
terrain = ["dep:jackdaw_runtime", "jackdaw_runtime/terrain", "dep:jackdaw_terrain"]

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_gltf", "bevy_world_serialization"] }
jackdaw_runtime = { version = "0.20.0-dev", path = "../../../crates/jackdaw_runtime", features = ["terrain"] }
jackdaw_terrain = { version = "0.20.0-dev", path = "../../../crates/jackdaw_terrain" }
tempfile = "3"

[lints]
workspace = true
