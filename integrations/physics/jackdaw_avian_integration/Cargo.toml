[package]
name = "jackdaw_avian_integration"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Avian physics for jackdaw games: colliders built from the colliders a scene authored"
license.workspace = true
repository.workspace = true

[package.metadata.jackdaw]
# The editor line this module is built for.
editor = "main"

[dependencies]
# See `jackdaw_pie_protocol`: this crate ships inside games, so its bevy
# features unify into theirs. Keep the list minimal and explicit.
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    "std",
    "serialize",
    "reflect_auto_register",
    "bevy_asset",
    "bevy_mesh",
] }
avian2d = { workspace = true }
avian3d = { workspace = true }
jackdaw_geometry = { version = "0.21.0-dev", path = "../../../crates/jackdaw_geometry" }
jackdaw_scene_types = { version = "0.21.0-dev", path = "../../../crates/jackdaw_scene_types" }
# The heights a loaded terrain is drawn from, for its ground collider.
jackdaw_runtime = { version = "0.21.0-dev", path = "../../../crates/jackdaw_runtime", default-features = false, optional = true }
jackdaw_terrain = { version = "0.21.0-dev", path = "../../../crates/jackdaw_terrain", default-features = false, optional = true }
# The collision shapes a loaded tilemap's tiles carry, chunk by chunk.
jackdaw_tilemap = { version = "0.21.0-dev", path = "../../../crates/jackdaw_tilemap", optional = true }

[features]
default = ["terrain", "tilemap"]
# A heightfield collider under every terrain a scene loads.
terrain = ["dep:jackdaw_runtime", "jackdaw_runtime/terrain", "dep:jackdaw_terrain"]
# Static colliders from the collision shapes of every tilemap a scene loads.
tilemap = ["dep:jackdaw_runtime", "jackdaw_runtime/tilemap", "dep:jackdaw_tilemap"]

[dev-dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = ["bevy_gltf", "bevy_world_serialization"] }
jackdaw_runtime = { version = "0.21.0-dev", path = "../../../crates/jackdaw_runtime", features = ["terrain", "tilemap"] }
jackdaw_terrain = { version = "0.21.0-dev", path = "../../../crates/jackdaw_terrain" }
jackdaw_tileset = { version = "0.21.0-dev", path = "../../../crates/jackdaw_tileset" }
tempfile = "3"

[lints]
workspace = true
