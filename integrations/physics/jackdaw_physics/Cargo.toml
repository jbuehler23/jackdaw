[package]
name = "jackdaw_physics"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "The Physics module's editor tooling: the physics tool, collider overlays and physics toggles in the inspector"
license.workspace = true
repository.workspace = true

[package.metadata.jackdaw]
# The editor line this module is built for.
editor = "0.20"
# Why this module cannot build on the current Bevy; CI reports it instead
# of building. Remove once avian releases for Bevy 0.20.
unavailable = "avian has no Bevy 0.20 release yet (avianphysics/avian#1070 ports it)"

[dependencies]
# The editor's Bevy feature set, so this crate and the editor agree on every
# type they share.
bevy = { version = "0.20", features = [
    "bevy_feathers",
    "bevy_scene",
    "bevy_dev_tools",
    "serialize",
    "debug",
    "bevy_remote",
    "file_watcher",
    "reflect_documentation",
    "reflect_functions",
] }
avian3d = { workspace = true, features = ["debug-plugin"] }
jackdaw_api = { version = "0.20.0-dev", path = "../../../crates/jackdaw_api" }
jackdaw_avian_integration = { workspace = true }
jackdaw_geometry = { version = "0.20.0-dev", path = "../../../crates/jackdaw_geometry" }
jackdaw_scene_types = { version = "0.20.0-dev", path = "../../../crates/jackdaw_scene_types" }

[dev-dependencies]
# The editor, to host the extension in tests the way a person's editor does.
jackdaw = { version = "0.20.0-dev", path = "../../.." }
jackdaw_api_internal = { version = "0.20.0-dev", path = "../../../crates/jackdaw_api_internal" }
jackdaw_bsn = { version = "0.20.0-dev", path = "../../../crates/jackdaw_bsn" }
jackdaw_bind = { version = "0.20.0-dev", path = "../../../crates/jackdaw_bind" }
jackdaw_env = { version = "0.20.0-dev", path = "../../../crates/jackdaw_env" }
jackdaw_feathers = { version = "0.20.0-dev", path = "../../../crates/jackdaw_feathers" }
jackdaw_project_build = { version = "0.20.0-dev", path = "../../../crates/jackdaw_project_build" }

[lints]
workspace = true
