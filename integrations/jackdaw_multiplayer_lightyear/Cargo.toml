[package]
name = "jackdaw_multiplayer_lightyear"
version = "0.19.0-rc.10"
rust-version = "1.95"
edition = "2024"
description = "Default lightyear backend for Jackdaw networking: translates proxy components into real lightyear replication at runtime."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
bevy = { version = "0.19", features = [
    "bevy_feathers",
    "bevy_scene",
    "bevy_dev_tools",
    "serialize",
    "debug",
    "bevy_remote",
    "file_watcher",
    "reflect_documentation",
    "reflect_functions",
] }
jackdaw_camera_rig = { version = "0.19.0-rc.10", path = "../../crates/jackdaw_camera_rig" }
jackdaw_multiplayer = { version = "0.19.0-rc.10", path = "../../crates/jackdaw_multiplayer" }
# Needed to express the `Serialize + DeserializeOwned` registration bounds in
# `MultiplayerAppExt` (mirrors lightyear's own `register_component` bounds).
serde = "1"
lightyear = { version = "0.28", default-features = false, features = [
    "client",
    "server",
    "replication",
    "interpolation",
    "input_native",
    "netcode",
    "udp",
] }

[dev-dependencies]
serde = "1"

[lints]
workspace = true

# Its own workspace, so the editor's workspace and lockfile never resolve
# lightyear. The jackdaw crates it uses come from the main workspace by path.
[workspace]

[workspace.lints.clippy]
doc_markdown = "warn"

redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
unwrap_or_default = "warn"
disallowed_methods = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
print_stdout = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# see: https://github.com/bevyengine/bevy/pull/15375#issuecomment-2366966219
too_long_first_doc_paragraph = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
match_same_arms = "warn"
manual_let_else = "warn"
print_stderr = "warn"
redundant_closure_for_method_calls = "warn"

# TODO: enable these if you have time!
# undocumented_unsafe_blocks = "warn"
